<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <title>Early Teams</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 13px; padding: 20px; margin: 0; overflow-x: hidden; position: relative; }
        html { overflow-x: hidden; }
        h1 { margin: 0 0 4px 0; }
        .subtitle { position: absolute; top: 20px; right: 20px; margin: 0; font-size: 12px; color: #888; font-weight: normal; }
        .subtitle a { color: #888; text-decoration: underline; text-decoration-thickness: 0.5px; text-underline-offset: 2px; }
        .subtitle a:hover { color: #333; }
        .subtitle a::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            border-top: 1px solid currentColor;
            border-right: 1px solid currentColor;
            transform: rotate(45deg) translateY(1px);
            margin-left: 4px;
        }
        @media (max-width: 480px) {
            .subtitle a::after { display: none; }
        }
        h2 { margin: 10px 0; }
        h3 { margin: 10px 0 5px 0; font-size: 13px; }
        h4 { margin: 8px 0 4px 0; font-size: 12px; font-weight: normal; color: #666; }
        .header { margin-bottom: 15px; }
        .search-bar {
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        #search-input {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 13px;
            padding: 4px 24px 4px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            width: 250px;
            background: transparent;
        }
        
        #search-input:focus {
            outline: none;
            border-bottom-color: #333;
        }
        
        #search-input::placeholder {
            color: #999;
        }
        
        .search-clear {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 14px;
            background: none;
            border: none;
            padding: 4px;
        }
        
        .search-clear:hover {
            color: #333;
        }
        
        .search-results-info {
            margin-bottom: 10px;
            color: #666;
        }
        
        .search-match {
            background: #fff3cd;
        }
        
        /* Title cell layout */
        .title-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .title-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .role-tag {
            flex-shrink: 0;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            margin-right: 8px;
        }
        .role-tag-eng { background: #dbeafe; color: #1e40af; }
        .role-tag-founder { background: #f3e8ff; color: #7c3aed; }
        .role-tag-design { background: #dcfce7; color: #166534; }
        .role-tag-gtm { background: #fee2e2; color: #dc2626; }
        .role-tag-ops { background: #ffedd5; color: #c2410c; }
        .role-tag-other { background: #fef9c3; color: #a16207; }
        .role-tag-product { background: #e0e7ff; color: #4338ca; }
        .role-tag-finance { background: #f0fdf4; color: #15803d; }
        .role-tag-talent { background: #fce7f3; color: #be185d; }
        
        /* Prevent line breaks in tenure */
        td[title] {
            white-space: nowrap;
        }
        
        /* Column styling - consistent widths */
        table { width: 100%; table-layout: fixed; font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; }
        th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .col-rank { width: 25px; }
        .col-name { width: 140px; }
        .col-title { width: 280px; }
        .col-yoe { width: 35px; }
        .col-start { width: 40px; }
        .col-edu { width: 250px; }
        .col-prev { width: auto; }
        .col-action { width: 25px; padding: 4px !important; }
        
        /* Search results has company column */
        .col-company { width: 80px; }
        
        /* Logo styling */
        .logo-icon {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            border-radius: 2px;
        }
        
        .with-logo {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .tabs { margin-bottom: 15px; }
        .tabs span { color: #999; cursor: pointer; }
        .tabs span:hover { color: #333; }
        .tabs span.active { color: #000; font-weight: bold; text-decoration: underline; }
        .tabs .sep { color: #ccc; margin: 0 8px; cursor: default; }
        
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            max-width: 100%;
        }
        
        .chart-panel {
            position: sticky;
            top: 20px;
            flex-shrink: 0;
            width: 320px;
        }
        
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 15px;
        }
        
        .chart-row {
            display: flex;
            align-items: center;
            font-variant-numeric: tabular-nums;
            height: 18px;
        }
        
        .chart-label {
            width: 45px;
            font-size: 10px;
            text-align: right;
            padding-right: 8px;
            flex-shrink: 0;
        }
        
        .chart-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .chart-bar {
            background: #d0d0d0;
            height: 14px;
            min-width: 0;
            transition: background 0.1s;
        }
        
        .chart-count {
            font-size: 10px;
            padding-left: 5px;
            color: #666;
        }
        
        .chart-raise {
            font-size: 9px;
            padding-left: 8px;
            color: #2a7c2a;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .chart-row.highlight .chart-bar { background: #333; }
        .chart-row.highlight .chart-label { font-weight: bold; }
        .chart-row.highlight .chart-count { color: #000; font-weight: bold; }
        .chart-row.selected { background: #eee; }
        
        .snapshot {
            border-top: 1px solid #ccc;
            padding-top: 10px;
            font-size: 11px;
        }
        
        .snapshot-header {
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        .snapshot-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        
        .snapshot-label {
            color: #333;
        }
        
        .snapshot-count {
            font-weight: bold;
        }
        
        .snapshot-sublevel {
            font-size: 10px;
            color: #666;
            padding-left: 24px;
        }
        
        .snapshot-names-section {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }
        
        .snapshot-names-group {
            margin-bottom: 6px;
        }
        
        .snapshot-names-label {
            font-size: 9px;
            color: #999;
            display: block;
        }
        
        .snapshot-names {
            font-size: 10px;
            color: #666;
            line-height: 1.4;
        }
        
        .table-panel {
            flex: 1;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .table-panel table {
            min-width: 900px;
        }
        
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f5f5f5; position: sticky; top: 0; }
        a { color: #0066cc; }
        
        .spam-btn { cursor: pointer; padding: 2px 8px; font-size: 11px; }
        
        tr.employee-row { transition: background 0.1s; }
        tr.employee-row.soft-highlight { background: #e8e8e8; }
        tr.employee-row.primary-highlight { background: #c0c0c0; }
        
        .title-cell { cursor: help; }
        .title-cell:hover { text-decoration: underline dotted #999; }
        
        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                font-size: 13px;
            }
            
            h1 { font-size: 20px; }
            h2 { font-size: 15px; }
            .subtitle { position: static; font-size: 11px; margin: 0 0 10px 0; }
            
            .header {
                margin-bottom: 12px;
            }
            
            .search-bar {
                display: block;
                margin-bottom: 12px;
            }
            
            #search-input {
                width: 100%;
                box-sizing: border-box;
                font-size: 16px;
                padding: 8px 28px 8px 0;
            }
            
            .search-clear {
                font-size: 18px;
            }
            
            .tabs {
                overflow-x: auto;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 10px;
                margin-bottom: 12px;
            }
            
            .tabs span {
                font-size: 14px;
                padding: 8px 4px;
                display: inline-block;
            }
            
            .tabs .sep {
                margin: 0 2px;
                padding: 8px 0;
            }
            
            /* Chart on top, table below on mobile */
            .main-layout {
                flex-direction: column;
            }
            
            .chart-panel {
                position: static;
                width: 100%;
                max-height: none;
                overflow-y: visible;
                border-bottom: 1px solid #ccc;
                border-top: none;
                padding-top: 0;
                padding-bottom: 10px;
                margin-bottom: 10px;
                margin-top: 0;
            }
            
            .chart-panel h3 {
                display: none;
            }
            
            .table-panel {
                width: 100%;
            }
            
            /* Horizontal bar chart on mobile */
            .chart-container {
                display: flex !important;
                flex-direction: row !important;
                align-items: flex-end !important;
                gap: 0 !important;
                height: 40px !important;
                width: 100% !important;
                margin-bottom: 0 !important;
            }
            
            .chart-row {
                flex: 1 1 0 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-end !important;
                align-items: stretch !important;
                height: 100% !important;
                min-width: 0 !important;
                padding: 0 !important;
            }
            
            /* Hide labels, counts, raises on mobile */
            .chart-label,
            .chart-count,
            .chart-raise {
                display: none !important;
            }
            
            .chart-bar-container {
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-end !important;
                flex: 1 !important;
                height: 100% !important;
            }
            
            .chart-bar {
                width: 100% !important;
                height: var(--h, 0%) !important;
                min-width: 0 !important;
                background: #d0d0d0 !important;
            }
            
            /* Hide team preview on mobile */
            .snapshot {
                display: none;
            }
            
            /* Scrollable table on mobile */
            .table-panel {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            .table-panel table {
                min-width: 650px;
                font-size: 11px;
            }
            
            th, td {
                padding: 3px 4px;
            }
            
            /* Compact column widths for mobile */
            .col-rank { width: 20px; }
            .col-name { width: 100px; }
            .col-title { width: 140px; }
            .col-yoe { width: 30px; }
            .col-start { width: 35px; }
            .col-edu { width: 100px; }
            .col-prev { width: auto; }
            .col-company { width: 55px; }
            
            /* Hide logos on mobile */
            .logo-icon {
                display: none;
            }
            
            .role-tag {
                font-size: 8px;
                padding: 1px 4px;
            }
            
            /* Easier tap targets */
            a {
                padding: 4px 0;
                display: inline-block;
            }
        }
        
        .info-tooltip {
            position: relative;
            cursor: help;
            border-bottom: 1px dotted #888;
        }
        .info-tooltip .tooltip-text {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 5px;
        }
        .info-tooltip:hover .tooltip-text {
            display: block;
        }
        .mobile-disclaimer {
            display: none;
            background: #f5f5f5;
            padding: 8px 12px;
            font-size: 11px;
            color: #666;
            border-radius: 4px;
            margin-top: 8px;
            position: relative;
        }
        .mobile-disclaimer .close-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            color: #999;
        }
        @media (max-width: 480px) {
            .info-tooltip .tooltip-text { display: none !important; }
            .mobile-disclaimer { display: none; }
            .mobile-disclaimer.visible { display: block; }
        }
        
    </style>
</head>
<body>
    <div class="header">
        <h1>Early Teams</h1>
        <p class="subtitle">By <a href="https://kevinniechen.com" target="_blank">Kevin Niechen</a></p>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search across all companies..." autocomplete="off">
            <span id="search-clear" class="search-clear" style="display: none;">×</span>
        </div>
        <div class="tabs" id="tabs"></div>
        <div id="company-info"></div>
    </div>
    <div id="content">Loading...</div>

    <script>
        const COMPANIES = [
            { slug: 'perplexity', file: 'perplexity_processed.json' },
            { slug: 'cognition', file: 'cognition_processed.json' },
            { slug: 'cursor', file: 'cursor_processed.json' },
            { slug: 'elevenlabs', file: 'elevenlabs_processed.json' },
            { slug: 'physical-intelligence', file: 'physical-intelligence_processed.json' },
            { slug: 'harvey', file: 'harvey_processed.json' },
            { slug: 'sierra', file: 'sierra_processed.json' },
            { slug: 'glean', file: 'glean_processed.json' },
            { slug: 'saronic', file: 'saronic_processed.json' },
            { slug: 'decagon', file: 'decagon_processed.json' },
            { slug: 'contextual', file: 'contextual_processed.json' },
            { slug: 'distyl', file: 'distyl_processed.json' },
            { slug: 'serval', file: 'serval_processed.json' },
            { slug: 'brainco', file: 'brainco_processed.json' },
        ];
        
        // Category order for sorting within months
        const CATEGORY_ORDER = ['Founder', 'Engineering', 'Product', 'Design', 'GTM', 'Finance', 'Talent', 'Ops', 'Other'];
        
        // Sort employees by: start_date, then category, then YoE (descending)
        function sortEmployees(employees) {
            return employees.sort((a, b) => {
                // First by start_date
                const dateCompare = a.start_date.localeCompare(b.start_date);
                if (dateCompare !== 0) return dateCompare;
                
                // Then by category order
                const catA = categorizeRole(a).category;
                const catB = categorizeRole(b).category;
                const catIndexA = CATEGORY_ORDER.indexOf(catA);
                const catIndexB = CATEGORY_ORDER.indexOf(catB);
                if (catIndexA !== catIndexB) return catIndexA - catIndexB;
                
                // Then by YoE (descending - more experience first)
                const yoeA = typeof inferYoE(a) === 'number' ? inferYoE(a) : -1;
                const yoeB = typeof inferYoE(b) === 'number' ? inferYoE(b) : -1;
                return yoeB - yoeA;
            });
        }
        
        let companyData = {};
        let spamData = {};
        let raisesData = {};
        let currentCompany = null;
        let currentEmployees = [];
        let allMonths = [];
        let selectedMonth = null;
        let searchMode = false;
        let searchQuery = '';
        let companyInceptionDate = null;
        
        // Role categorization
        function getEngLevel(yoe) {
            const y = parseInt(yoe) || 0;
            if (y <= 3) return 'Jr';
            if (y <= 8) return 'Mid';
            return 'Sr';
        }
        
        // Score-based role classification
        function normalizeTitle(raw) {
            return (raw || "")
                .toLowerCase()
                .replace(/[/|,;()]/g, " ")
                .replace(/&/g, " and ")
                .replace(/\bco[\s-]?founder\b/g, "cofounder")
                .replace(/[.]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }
        
        function reTest(s, re) { return re.test(s); }
        
        function extractFlags(t) {
            // Check if this is a supporting role (assistant to, office of, coordinator for a C-level)
            const isSupportingCLevel = reTest(t, /\b(assistant|coordinator|associate)\s+(to|for)\b/) ||
                                       reTest(t, /\bto\s+(the\s+)?(ceo|cto|cfo|coo|cpo|chief|president)\b/) ||
                                       reTest(t, /\boffice\s+of\s+(the\s+)?(ceo|cto|coo|chief)\b/) ||
                                       reTest(t, /\bexecutive\s+assistant\b/);
            
            // C-level detection: must have C-level title but NOT be supporting someone else
            const hasCLevelTitle = reTest(t, /\b(ceo|cto|cfo|cpo|cro|cso|cbo)\b/) || 
                                   (reTest(t, /\bchief\b/) && reTest(t, /\bofficer\b/));
            // COO is special - it's C-level but should be Ops, not Founder
            const isCOO = reTest(t, /\bcoo\b/) || reTest(t, /\bchief\s+operating\s+officer\b/);
            
            return {
                founder: reTest(t, /\b(founder|cofounder)\b/),
                assistant: reTest(t, /\bassistant\b/),
                advisor: reTest(t, /\b(advisor|adviser)\b/),
                board: reTest(t, /\b(board|director)\b/) && reTest(t, /\bboard\b/),
                interim: reTest(t, /\b(interim|acting)\b/),
                cLevel: hasCLevelTitle && !isSupportingCLevel,
                isCOO: isCOO,
                isSupportingRole: isSupportingCLevel,
            };
        }
        
        function extractSeniority(t) {
            if (reTest(t, /\b(ceo|cto|cfo|coo|cpo|cro|cso|cbo)\b/) || reTest(t, /\bchief\b/)) return "CLevel";
            if (reTest(t, /\b(evp|svp)\b/)) return "SVP";
            if (reTest(t, /\b(vp|vice president)\b/)) return "VP";
            if (reTest(t, /\b(head of)\b/)) return "Head";
            if (reTest(t, /\b(director)\b/)) return "Director";
            if (reTest(t, /\b(manager)\b/)) return "Manager";
            if (reTest(t, /\b(principal|staff)\b/)) return "Staff+";
            if (reTest(t, /\b(senior|sr)\b/)) return "Senior";
            if (reTest(t, /\b(junior|jr)\b/)) return "Junior";
            if (reTest(t, /\b(intern)\b/)) return "Intern";
            return null;
        }
        
        function scoreEducation(edu) {
            if (!edu) return {};
            const e = edu.toLowerCase();
            const scores = {
                Design: 0,
                Engineering: 0,
                Product: 0,
                GTM: 0,
                Finance: 0,
                Talent: 0,
                Ops: 0,
                Legal: 0,
                Other: 0,
            };
            
            // Technical degrees → Engineering
            if (reTest(e, /\b(cs|computer science|computer engineering|ce|software)\b/)) scores.Engineering += 4;
            if (reTest(e, /\b(ee|electrical engineering|eecs)\b/)) scores.Engineering += 4;
            if (reTest(e, /\b(math|mathematics|applied math|statistics|stats)\b/)) scores.Engineering += 3;
            if (reTest(e, /\b(physics|phd)\b/)) scores.Engineering += 3;
            if (reTest(e, /\b(machine learning|ml|ai|artificial intelligence|data science)\b/)) scores.Engineering += 4;
            if (reTest(e, /\b(mechanical engineering|me|aerospace)\b/)) scores.Engineering += 2;
            
            // Design degrees
            if (reTest(e, /\b(design|bfa|mfa|graphic|visual|hci|human computer)\b/)) scores.Design += 4;
            
            // Business/GTM degrees
            if (reTest(e, /\b(mba|business administration|marketing)\b/)) scores.GTM += 3;
            if (reTest(e, /\b(communications|public relations)\b/)) scores.GTM += 3;
            
            // Finance degrees
            if (reTest(e, /\b(finance|accounting|economics|econ)\b/)) scores.Finance += 3;
            
            // Legal degrees
            if (reTest(e, /\b(jd|law|juris|legal)\b/)) scores.Legal += 4;
            
            // HR/Psychology
            if (reTest(e, /\b(psychology|hr|human resources|organizational)\b/)) scores.Talent += 3;
            
            return scores;
        }
        
        function scoreFunctions(t) {
            // Handle conflict phrases explicitly
            const isProductMarketing = reTest(t, /\bproduct marketing\b/);
            const isProductDesign = reTest(t, /\b(product designer|product design|design lead)\b/);
            const isProductOps = reTest(t, /\bproduct ops|product operations\b/);
            const isSalesEngineer = reTest(t, /\bsales engineer\b/);
            
            const scores = {
                Design: 0,
                Engineering: 0,
                Product: 0,
                GTM: 0,
                Finance: 0,
                Talent: 0,
                Ops: 0,
                Legal: 0,
                Other: 0,
            };
            
            // Design - HIGH priority, check before generic "product"
            if (reTest(t, /\b(designer|ux|ui|visual|brand|creative)\b/)) scores.Design += 10;
            if (reTest(t, /\bdesign\b/) && !reTest(t, /\bdesign (thinking|sprint)\b/)) scores.Design += 8;
            if (isProductDesign) scores.Design += 12; // Very high - Product Designer is Design, not Product
            
            // Engineering
            if (reTest(t, /\b(engineer|engineering|developer|software|swe|architect)\b/)) scores.Engineering += 6;
            if (reTest(t, /\b(infra|infrastructure|platform|backend|frontend|fullstack|full stack)\b/)) scores.Engineering += 4;
            if (reTest(t, /\b(devops|mlops|secops|sre|site reliability)\b/)) scores.Engineering += 5;
            if (reTest(t, /\b(machine learning|ml|research|scientist|data scientist|data science)\b/)) scores.Engineering += 5;
            if (reTest(t, /\b(technical staff|member of technical staff)\b/)) scores.Engineering += 6;
            // Cognition's quirky titles
            if (reTest(t, /^human$/)) scores.Engineering += 10;
            if (reTest(t, /\bhuman\s+(software|engineer|product)\b/)) scores.Engineering += 10;
            
            // Product - lower base, gets overridden by Design/GTM when appropriate
            if (reTest(t, /\b(product manager|pm)\b/) && !isProductMarketing) scores.Product += 7;
            if (reTest(t, /\b(vp|vice president|head|director)\s+(of\s+)?product\b/) && !isProductDesign && !isProductMarketing) scores.Product += 10;
            if (reTest(t, /\bproduct lead\b/) && !isProductDesign) scores.Product += 5;
            if (reTest(t, /\bproduct\b/) && !isProductDesign && !isProductMarketing && !isProductOps) scores.Product += 2;
            if (isProductMarketing || isProductDesign || isProductOps) scores.Product -= 10; // Strong negative
            
            // GTM
            if (reTest(t, /\bgtm\b/)) scores.GTM += 10; // Explicit "GTM" in title
            if (reTest(t, /\b(sales|account executive|account exec|ae\b|bdr|sdr)\b/)) scores.GTM += 8;
            if (reTest(t, /\b(marketing|growth|demand gen|communications|comms|pr\b)\b/)) scores.GTM += 7;
            if (reTest(t, /\b(business development|biz dev|partnerships?)\b/)) scores.GTM += 7;
            if (reTest(t, /\b(customer success|csm)\b/)) scores.GTM += 7;
            if (reTest(t, /\bpresident\b/) && !reTest(t, /vice president/)) scores.GTM += 7;
            if (isProductMarketing) scores.GTM += 8;
            if (isSalesEngineer) { scores.GTM += 3; scores.Engineering += 3; }
            if (reTest(t, /\bsales\s+(director|enablement|lead)\b/)) scores.GTM += 9;
            
            // Finance - VERY HIGH priority for explicit finance titles
            if (reTest(t, /\baccountant\b/)) scores.Finance += 12;
            if (reTest(t, /\b(finance|financial)\b/)) scores.Finance += 10;
            if (reTest(t, /\b(controller|treasury|accounting)\b/)) scores.Finance += 10;
            if (reTest(t, /\b(vp|vice president)\s+(of\s+)?finance\b/)) scores.Finance += 12;
            
            // Talent / People
            if (reTest(t, /\b(recruit|recruiting|recruiter|talent)\b/)) scores.Talent += 9;
            if (reTest(t, /\b(people|hr|human resources)\b/) && !reTest(t, /^human$/)) scores.Talent += 8;
            
            // Ops
            if (reTest(t, /\b(operations|ops)\b/) && !isProductOps) scores.Ops += 7;
            if (reTest(t, /\b(biz ops|business ops|chief of staff|special projects)\b/)) scores.Ops += 8;
            if (isProductOps) scores.Ops += 8;
            if (reTest(t, /\boperations\s+coordinator\b/)) scores.Ops += 10;
            
            // Legal - map to Other since we don't have a Legal category in display
            if (reTest(t, /\b(legal|counsel|attorney|general counsel)\b/)) scores.Other += 10;
            
            return scores;
        }
        
        function pickFunction(scores) {
            let best = { fn: "Other", score: -Infinity };
            for (const [fn, sc] of Object.entries(scores)) {
                // Skip Legal since it maps to Other in display
                if (fn === "Legal") continue;
                if (sc > best.score) best = { fn, score: sc };
            }
            // Threshold so random weak hits don't classify
            if (best.score < 5) return { function: "Other", confidence: 0.3 };
            return { function: best.fn, confidence: Math.min(0.95, 0.5 + best.score / 20) };
        }
        
        function categorizeRole(emp) {
            const cur = normalizeTitle(emp.original_title || emp.title || "");
            const prev = normalizeTitle(emp.previous_title || "");
            const yoe = emp.yoe;
            
            const curFlags = extractFlags(cur);
            const prevFlags = extractFlags(prev);
            
            // Founders get special treatment (but not COOs or supporting roles)
            if (curFlags.founder) {
                return { category: 'Founder', level: null, confidence: 0.95, seniority: 'CLevel', flags: curFlags };
            }
            
            // C-level executives (except COO which is Ops, and except supporting roles)
            if (curFlags.cLevel && !curFlags.assistant && !curFlags.isCOO && !curFlags.isSupportingRole) {
                return { category: 'Founder', level: null, confidence: 0.95, seniority: 'CLevel', flags: curFlags };
            }
            
            // COO is Ops, not Founder
            if (curFlags.isCOO && !curFlags.isSupportingRole) {
                return { category: 'Ops', level: null, confidence: 0.95, seniority: 'CLevel', flags: curFlags };
            }
            
            const curScores = scoreFunctions(cur);
            const prevScores = scoreFunctions(prev);
            const eduScores = scoreEducation(emp.education);
            
            // Special case: ambiguous current titles - rely more on previous title and education
            const isAmbiguousCurrent = reTest(cur, /^(founding team|human|member|employee|team member|building|making|working)$/) ||
                                       reTest(cur, /^building\s+.+$/) || // "Building Cursor", "Building Embodied Ai"
                                       reTest(cur, /^(employee|staff|team)\s*(at|@)?\s*\w*$/i) ||
                                       reTest(cur, /^(private equity|investor|advisor)$/);
            const curWeight = isAmbiguousCurrent ? 0.2 : 1.0;
            const prevWeight = isAmbiguousCurrent ? 1.0 : 0.4;
            const eduWeight = isAmbiguousCurrent ? 0.8 : 0.3; // Education matters more for ambiguous titles
            
            // Combine evidence: current title + previous title + education
            const combinedScores = {};
            for (const k of Object.keys(curScores)) {
                combinedScores[k] = curScores[k] * curWeight + prevScores[k] * prevWeight + (eduScores[k] || 0) * eduWeight;
            }
            
            const { function: fn, confidence } = pickFunction(combinedScores);
            const seniority = extractSeniority(cur) || extractSeniority(prev);
            
            const flags = {
                ...curFlags,
                founder: curFlags.founder,
                assistant: curFlags.assistant || prevFlags.assistant,
                advisor: curFlags.advisor || prevFlags.advisor,
                interim: curFlags.interim || prevFlags.interim,
            };
            
            // Show seniority for Eng, Design, Product, GTM, Ops
            const showLevelFor = ["Engineering", "Design", "Product", "GTM", "Ops"];
            const level = showLevelFor.includes(fn) ? getEngLevel(yoe) : null;
            return { category: fn, level, confidence, seniority, flags };
        }
        
        function formatPersonName(name, age) {
            const parts = name.split(' ');
            const firstName = parts[0];
            const ageStr = age && age !== '?' ? ' ' + age.replace('~', '') : '';
            return `${firstName}${ageStr}`;
        }
        
        function getGradYear(education) {
            // Extract year from education like "BS CS, MIT '16" -> "'16"
            if (!education || education === 'N/A') return '?';
            const match = education.match(/'(\d{2})/);
            return match ? `'${match[1]}` : '?';
        }
        
        function inferYoE(employee) {
            // If YoE is provided and valid, use it (already calculated at hire time by process_employees.py)
            if (employee.yoe != null && employee.yoe !== '?' && !isNaN(parseInt(employee.yoe))) {
                return Math.max(0, parseInt(employee.yoe));
            }
            // Otherwise infer from graduation year at time of hiring (not current date)
            const gradYear = employee.grad_year || getGradYear(employee.education);
            if (gradYear && gradYear !== '?') {
                const yearNum = parseInt(gradYear.replace("'", ""));
                const fullYear = yearNum > 50 ? 1900 + yearNum : 2000 + yearNum;
                // Use hire date year, not current year
                const hireYear = employee.start_date ? parseInt(employee.start_date.split('-')[0]) : new Date().getFullYear();
                return Math.max(0, hireYear - fullYear);
            }
            return '?';
        }
        
        function formatDate(dateStr) {
            // Convert "2022-08" to "08-2022"
            if (!dateStr) return '?';
            const parts = dateStr.split('-');
            if (parts.length === 2) {
                return `${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }
        
        function formatTenure(startDate, inceptionDate) {
            // Convert start date to months since company inception (first hire = 0mo)
            if (!startDate) return '?';
            const inception = inceptionDate || companyInceptionDate;
            if (!inception) return '?';
            
            const [startYear, startMonth] = startDate.split('-').map(Number);
            const [incYear, incMonth] = inception.split('-').map(Number);
            
            const totalMonths = Math.max(0, (startYear - incYear) * 12 + (startMonth - incMonth));
            
            // Format as Xy Ymo (e.g., 1y2mo, 0mo, 2y0mo)
            const years = Math.floor(totalMonths / 12);
            const months = totalMonths % 12;
            
            if (years === 0) {
                return `${months}mo`;
            }
            return `${years}y${months}mo`;
        }

        function buildSnapshot(employees, month) {
            // Get cumulative team up to and including selected month
            const team = employees.filter(e => e.start_date <= month);
            
            if (team.length === 0) {
                return '<div class="snapshot"><div class="snapshot-header">No team yet</div></div>';
            }
            
            // Categorize everyone
            const categories = {};
            const categoryPeople = {};
            const engLevels = { Jr: [], Mid: [], Sr: [] };
            
            team.forEach(e => {
                const { category, level } = categorizeRole(e);
                
                if (category === 'Engineering' && level) {
                    engLevels[level].push(e);
                }
                
                if (!categories[category]) {
                    categories[category] = 0;
                    categoryPeople[category] = [];
                }
                categories[category]++;
                categoryPeople[category].push(e);
            });
            
            // Sort helper: parse age, youngest first (lowest number first)
            const getAgeNum = (e) => {
                const age = e.age;
                if (!age || age === '?') return 999;
                return parseInt(age.replace('~', '')) || 999;
            };
            const sortByAge = (arr) => arr.sort((a, b) => getAgeNum(a) - getAgeNum(b));
            
            // Sort all category arrays by age
            Object.keys(categoryPeople).forEach(cat => sortByAge(categoryPeople[cat]));
            Object.keys(engLevels).forEach(level => sortByAge(engLevels[level]));
            
            const parts = month.split('-');
            const displayMonth = parts[1] + '/' + parts[0].slice(2);
            
            let html = '<div class="snapshot">';
            html += `<div class="snapshot-header">Team @ ${displayMonth}: ${team.length}</div>`;
            
            const order = ['Founder', 'Engineering', 'Product', 'Design', 'GTM', 'Finance', 'Talent', 'Ops', 'Other'];
            
            // Counts section
            order.forEach(cat => {
                if (categories[cat] && categories[cat] > 0) {
                    html += `<div class="snapshot-row">
                        <span class="snapshot-label">${renderRoleTag(cat)}</span>
                        <span class="snapshot-count">${categories[cat]}</span>
                    </div>`;
                    
                    if (cat === 'Engineering') {
                        const jrCount = engLevels.Jr.length;
                        const midCount = engLevels.Mid.length;
                        const srCount = engLevels.Sr.length;
                        
                        const breakdown = [];
                        if (jrCount) breakdown.push(`${jrCount} Jr`);
                        if (midCount) breakdown.push(`${midCount} Mid`);
                        if (srCount) breakdown.push(`${srCount} Sr`);
                        
                        if (breakdown.length) {
                            html += `<div class="snapshot-sublevel">${breakdown.join(' · ')}</div>`;
                        }
                    }
                }
            });
            
            // Names section
            html += '<div class="snapshot-names-section">';
            order.forEach(cat => {
                if (categoryPeople[cat] && categoryPeople[cat].length > 0) {
                    const names = categoryPeople[cat].map(e => formatPersonName(e.name, e.age)).join(', ');
                    html += `<div class="snapshot-names-group">
                        <span class="snapshot-names-label">${cat}</span>
                        <span class="snapshot-names">${names}</span>
                    </div>`;
                }
            });
            html += '</div>';
            
            html += '</div>';
            return html;
        }
        
        async function loadData() {
            let manualAdditions = {};
            
            try {
                const spamRes = await fetch('/spam.json');
                if (spamRes.ok) spamData = await spamRes.json();
            } catch (e) {}
            
            try {
                const raisesRes = await fetch('/raises.json');
                if (raisesRes.ok) raisesData = await raisesRes.json();
            } catch (e) {}
            
            try {
                const manualRes = await fetch('/manual_additions.json?v=' + Date.now());
                if (manualRes.ok) manualAdditions = await manualRes.json();
            } catch (e) {}
            
            for (const company of COMPANIES) {
                try {
                    const response = await fetch(company.file + '?v=' + Date.now());
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Merge manual additions if any exist for this company
                        if (manualAdditions[company.slug]) {
                            const existingNames = new Set(data.employees.map(e => e.name.toLowerCase()));
                            const additions = manualAdditions[company.slug]
                                .filter(e => !existingNames.has(e.name.toLowerCase()))
                                .map(e => ({
                                    ...e,
                                    original_title: e.title,
                                    yoe: e.yoe || '?',
                                    grad_year: e.grad_year || (e.education?.match(/'(\d{2})/) ? `'${e.education.match(/'(\d{2})/)[1]}` : '?')
                                }));
                            data.employees = [...data.employees, ...additions];
                        }
                        
                        // Sort by start_date, then category, then YoE and re-rank
                        sortEmployees(data.employees);
                        data.employees.forEach((e, i) => e.rank = i + 1);
                        
                        companyData[company.slug] = data;
                    }
                } catch (e) {}
            }
            renderTabs();
            const first = Object.keys(companyData)[0];
            if (first) showCompany(first);
            else document.getElementById('content').textContent = 'No data found.';
        }
        
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const slugs = Object.keys(companyData);
            slugs.forEach((slug, i) => {
                const span = document.createElement('span');
                span.textContent = companyData[slug].company_display || slug;
                span.dataset.slug = slug;
                span.onclick = () => showCompany(slug);
                tabs.appendChild(span);
                if (i < slugs.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    tabs.appendChild(sep);
                }
            });
        }

        function buildTimeline(employees) {
            const byMonth = {};
            employees.forEach(e => {
                const month = e.start_date;
                if (!byMonth[month]) byMonth[month] = [];
                byMonth[month].push(e.rank);
            });
            
            const existingMonths = Object.keys(byMonth).sort();
            if (existingMonths.length === 0) return '<p>No hires</p>';
            
            allMonths = [];
            let [year, month] = existingMonths[0].split('-').map(Number);
            const [endYear, endMonth] = existingMonths[existingMonths.length - 1].split('-').map(Number);
            
            while (year < endYear || (year === endYear && month <= endMonth)) {
                const key = `${year}-${String(month).padStart(2, '0')}`;
                allMonths.push(key);
                if (!byMonth[key]) byMonth[key] = [];
                month++;
                if (month > 12) { month = 1; year++; }
            }
            
            const maxCount = Math.max(...allMonths.map(m => byMonth[m].length), 1);
            
            // Build lookup for raises
            const raises = raisesData[currentCompany] || [];
            const raisesByMonth = {};
            raises.forEach(r => {
                raisesByMonth[r.date] = r;
            });
            
            let html = '<div class="chart-container">';
            allMonths.forEach(m => {
                const hires = byMonth[m];
                const count = hires.length;
                const barWidth = count > 0 ? Math.max((count / maxCount) * 100, 5) : 0;
                const parts = m.split('-');
                const shortMonth = parts[1] + '/' + parts[0].slice(2);
                
                // Check for funding round this month
                const raise = raisesByMonth[m];
                let raiseHtml = '';
                if (raise) {
                    const amtStr = raise.amount >= 100 ? `$${raise.amount}M` : `$${raise.amount}M`;
                    raiseHtml = `<span class="chart-raise">— ${amtStr} ${raise.round}</span>`;
                }
                
                html += `<div class="chart-row" data-month="${m}" 
                    onmouseenter="highlightMonth('${m}')" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${m}', true)" style="cursor: pointer">
                    <span class="chart-label">${shortMonth}</span>
                    <div class="chart-bar-container">
                        <div class="chart-bar" style="width: ${barWidth}%; --h: ${barWidth * 0.4}px"></div>
                        <span class="chart-count">${count}</span>
                        ${raiseHtml}
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }
        
        function showCompany(slug) {
            currentCompany = slug;
            document.querySelectorAll('.tabs span[data-slug]').forEach(s => 
                s.classList.toggle('active', s.dataset.slug === slug));
            
            const data = companyData[slug];
            const allEmployees = data.employees || [];
            
            currentEmployees = allEmployees.filter(e => !isSpam(slug, e.name));
            const spamCount = allEmployees.length - currentEmployees.length;
            
            // Set inception date as the earliest hire
            companyInceptionDate = currentEmployees.length > 0 
                ? currentEmployees.map(e => e.start_date).filter(Boolean).sort()[0] 
                : null;
            
document.getElementById('company-info').innerHTML =
                `<strong>${data.company_display || data.company}</strong> · Founded: ${data.founded || '?'} · <span class="info-tooltip" onclick="document.getElementById('mobile-disclaimer').classList.toggle('visible')">${currentEmployees.length} employees<span class="tooltip-text">Snapshot from data provider. May not be up to date or entirely accurate.</span></span>${spamCount > 0 ? ` (${spamCount} hidden)` : ''}
                <div class="mobile-disclaimer" id="mobile-disclaimer">ℹ️ Snapshot from data provider. May not be up to date or entirely accurate. <span class="close-btn" onclick="event.stopPropagation(); this.parentElement.classList.remove('visible')">×</span></div>`;
            
            let html = '<div class="main-layout">';
            
            // Chart panel
            html += '<div class="chart-panel">';
            html += '<h3>Hires by Month</h3>';
            html += buildTimeline(currentEmployees);
            
            // Snapshot (default to last month)
            const lastMonth = allMonths.length > 0 ? allMonths[allMonths.length - 1] : null;
            html += `<div id="snapshot">${lastMonth ? buildSnapshot(currentEmployees, lastMonth) : ''}</div>`;
            html += '</div>';
            
            // Table panel
            html += '<div class="table-panel">';
            html += `<table>
                <thead>
                <tr>
                    <th class="col-rank">#</th>
                    <th class="col-start">Joined</th>
                    <th class="col-name">Name</th>
                    <th class="col-title">Role</th>
                    <th class="col-yoe">YoE</th>
                    <th class="col-edu">Education</th>
                    <th class="col-prev">Experience</th>
                    <th class="col-action"></th>
                </tr>
                </thead>
                <tbody>`;
            
            // Track counts per category for numbered tags
            const categoryCounts = {};
            
            currentEmployees.forEach((e, idx) => {
                const name = e.linkedin_url 
                    ? `<a href="${e.linkedin_url}" target="_blank">${e.name}</a>` 
                    : e.name;
                const yoe = inferYoE(e);
                const role = categorizeRole(e);
                
                // Get category number (founders don't get numbers)
                let categoryNum = null;
                if (role.category !== 'Founder') {
                    if (!categoryCounts[role.category]) categoryCounts[role.category] = 0;
                    categoryCounts[role.category]++;
                    categoryNum = categoryCounts[role.category];
                }
                
                const schoolLogo = getSchoolLogo(e.education);
                const companyLogo = getCompanyLogo(e.previous_company);
                const eduDisplay = renderWithLogo(e.education || 'N/A', schoolLogo);
                
                // Build experience display with up to 2 previous jobs
                let expParts = [];
                if (e.previous_company && e.previous_company !== 'N/A') {
                    expParts.push(`${e.previous_title} @ ${e.previous_company}`);
                }
                if (e.previous_company_2 && e.previous_company_2 !== 'N/A') {
                    expParts.push(`${e.previous_title_2} @ ${e.previous_company_2}`);
                }
                const expText = expParts.join('; ') || 'N/A';
                const prevDisplay = renderWithLogo(expText, companyLogo);
                
                const titleDisplay = `<span class="title-content">${renderRoleTag(role.category, categoryNum, role.level)}<span class="title-text">${e.original_title || e.title}</span></span>`;
                html += `<tr class="employee-row" data-month="${e.start_date}" 
                    onmouseenter="highlightMonth('${e.start_date}', this)" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${e.start_date}', false)" style="cursor: pointer">
                    <td>${idx + 1}</td>
                    <td>${formatTenure(e.start_date, companyInceptionDate)}</td>
                    <td>${name}</td>
                    <td title="${(e.original_title || e.title).replace(/"/g, '&quot;')}">${titleDisplay}</td>
                    <td>${yoe}</td>
                    <td title="${(e.education || '').replace(/"/g, '&quot;')}">${eduDisplay}</td>
                    <td title="${expText.replace(/"/g, '&quot;')}">${prevDisplay}</td>
                    <td class="col-action"><button class="spam-btn" onclick="toggleSpam('${slug}', '${e.name.replace(/'/g, "\\'")}')">×</button></td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            html += '</div>';
            
            document.getElementById('content').innerHTML = html;
        }
        
        // Search functionality
        function initSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear');
            
            input.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                searchQuery = query;
                clearBtn.style.display = query ? 'block' : 'none';
                
                if (query.length >= 2) {
                    searchMode = true;
                    showSearchResults(query);
                } else if (query.length === 0) {
                    searchMode = false;
                    if (currentCompany) {
                        showCompany(currentCompany);
                    }
                }
            });
            
            clearBtn.addEventListener('click', () => {
                input.value = '';
                searchQuery = '';
                clearBtn.style.display = 'none';
                searchMode = false;
                if (currentCompany) {
                    showCompany(currentCompany);
                }
            });
            
            // ESC to clear
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    clearBtn.click();
                    input.blur();
                }
            });
        }
        
        function searchAllCompanies(query) {
            const results = [];
            const q = query.toLowerCase().trim();
            
            // Split query into tokens - each token must be found somewhere
            // This allows "eng (mid)" to match "Eng #5 (Mid)" 
            const tokens = q.split(/\s+/).filter(t => t.length > 0);
            if (tokens.length === 0) return results;
            
            // Pre-compute category numbers for all companies first
            const categoryNumbersByCompany = {};
            Object.entries(companyData).forEach(([slug, data]) => {
                const employees = (data.employees || []).filter(e => !isSpam(slug, e.name));
                const categoryCounts = {};
                const empCategoryNums = {};
                employees.forEach(emp => {
                    const role = categorizeRole(emp);
                    if (role.category !== 'Founder') {
                        if (!categoryCounts[role.category]) categoryCounts[role.category] = 0;
                        categoryCounts[role.category]++;
                        empCategoryNums[emp.name] = { category: role.category, num: categoryCounts[role.category], level: role.level };
                    } else {
                        empCategoryNums[emp.name] = { category: role.category, num: null, level: null };
                    }
                });
                categoryNumbersByCompany[slug] = empCategoryNums;
            });
            
            Object.entries(companyData).forEach(([slug, data]) => {
                const companyName = data.company_display || slug;
                const employees = data.employees || [];
                
                employees.forEach(emp => {
                    if (isSpam(slug, emp.name)) return;
                    
                    // Get role info including computed number and level
                    const role = categorizeRole(emp);
                    const catData = categoryNumbersByCompany[slug]?.[emp.name];
                    const catNum = catData?.num;
                    const catLevel = catData?.level || role.level;
                    
                    // Build full role tag text for searching (e.g., "Design #3 (Jr)")
                    const tag = getRoleTag(role.category);
                    let roleTagText = tag.text;
                    if (role.category !== 'Founder' && catNum !== null) {
                        if (catLevel) {
                            roleTagText = `${tag.text} #${catNum} (${catLevel})`;
                        } else {
                            roleTagText = `${tag.text} #${catNum}`;
                        }
                    }
                    
                    // Build experience text for searching
                    let expParts = [];
                    if (emp.previous_company && emp.previous_company !== 'N/A') {
                        expParts.push(`${emp.previous_title} @ ${emp.previous_company}`);
                    }
                    if (emp.previous_company_2 && emp.previous_company_2 !== 'N/A') {
                        expParts.push(`${emp.previous_title_2} @ ${emp.previous_company_2}`);
                    }
                    const expText = expParts.join('; ');
                    
                    // Build tenure text for searching
                    const yoe = inferYoE(emp);
                    const yoeStr = String(yoe);
                    
                    // Combine all searchable text into one string
                    const searchText = [
                        emp.name,
                        emp.title,
                        emp.original_title,
                        emp.education,
                        emp.previous_title,
                        emp.previous_company,
                        emp.previous_title_2,
                        emp.previous_company_2,
                        expText,
                        role.category,
                        roleTagText,              // Full tag like "Design #3 (Jr)"
                        catLevel,                 // Just "Jr", "Mid", "Sr"
                        companyName,
                        emp.grad_year,
                        emp.start_date,
                        yoeStr                    // YoE number
                    ].filter(Boolean).map(s => String(s).toLowerCase()).join(' ');
                    
                    // All tokens must be found somewhere in the combined text
                    const matches = tokens.every(token => searchText.includes(token));
                    
                    if (matches) {
                        results.push({
                            ...emp,
                            company_slug: slug,
                            company_name: companyName
                        });
                    }
                });
            });
            
            // Sort by company then by rank
            results.sort((a, b) => {
                if (a.company_slug !== b.company_slug) {
                    return a.company_slug.localeCompare(b.company_slug);
                }
                return a.rank - b.rank;
            });
            
            return results;
        }
        
        function highlightMatch(text, query) {
            if (!text || !query) return text || '';
            // Split query into tokens and build a single regex to match any of them
            const tokens = query.toLowerCase().trim().split(/\s+/).filter(t => t.length > 0);
            if (tokens.length === 0) return text;
            
            // Escape each token and join with | for alternation, sort by length desc to match longer first
            const escaped = tokens
                .sort((a, b) => b.length - a.length)
                .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
            return text.replace(regex, '<span class="search-match">$1</span>');
        }
        
        function showSearchResults(query) {
            const results = searchAllCompanies(query);
            
            // Pre-compute inception dates and category numbers per company
            const inceptionDates = {};
            const categoryNumbersByCompany = {};
            Object.entries(companyData).forEach(([slug, data]) => {
                const employees = (data.employees || []).filter(e => !isSpam(slug, e.name));
                const dates = employees.map(e => e.start_date).filter(Boolean).sort();
                inceptionDates[slug] = dates[0] || null;
                
                // Pre-compute category numbers for each employee in this company
                const categoryCounts = {};
                const empCategoryNums = {};
                employees.forEach(emp => {
                    const role = categorizeRole(emp);
                    if (role.category !== 'Founder') {
                        if (!categoryCounts[role.category]) categoryCounts[role.category] = 0;
                        categoryCounts[role.category]++;
                        empCategoryNums[emp.name] = { category: role.category, num: categoryCounts[role.category] };
                    }
                });
                categoryNumbersByCompany[slug] = empCategoryNums;
            });
            
            // Update tabs to show none selected
            document.querySelectorAll('.tabs span[data-slug]').forEach(s => 
                s.classList.remove('active'));
            
            document.getElementById('company-info').innerHTML = 
                `<span class="search-results-info">Found <strong>${results.length}</strong> results for "<strong>${query}</strong>" across all companies</span>`;
            
            let html = '<div class="table-panel" style="width: 100%">';
            html += `<table>
                <thead>
                <tr>
                    <th class="col-rank">#</th>
                    <th class="col-start">Joined</th>
                    <th class="col-company">Company</th>
                    <th class="col-name">Name</th>
                    <th class="col-title">Role</th>
                    <th class="col-yoe">YoE</th>
                    <th class="col-edu">Education</th>
                    <th class="col-prev">Experience</th>
                </tr>
                </thead>
                <tbody>`;
            
            results.forEach(e => {
                const name = e.linkedin_url 
                    ? `<a href="${e.linkedin_url}" target="_blank">${highlightMatch(e.name, query)}</a>` 
                    : highlightMatch(e.name, query);
                const yoe = inferYoE(e);
                const role = categorizeRole(e);
                const title = highlightMatch(e.original_title || e.title, query);
                const education = highlightMatch(e.education, query);
                const companyHighlight = highlightMatch(e.company_name, query);
                const schoolLogo = getSchoolLogo(e.education);
                const companyLogo = getCompanyLogo(e.previous_company);
                const eduDisplay = schoolLogo ? `<span class="with-logo"><img class="logo-icon" src="${schoolLogo}" onerror="this.style.display='none'"><span>${education}</span></span>` : education;
                
                // Build experience display with up to 2 previous jobs
                let expParts = [];
                if (e.previous_company && e.previous_company !== 'N/A') {
                    expParts.push(`${highlightMatch(e.previous_title, query)} @ ${highlightMatch(e.previous_company, query)}`);
                }
                if (e.previous_company_2 && e.previous_company_2 !== 'N/A') {
                    expParts.push(`${highlightMatch(e.previous_title_2, query)} @ ${highlightMatch(e.previous_company_2, query)}`);
                }
                const expText = expParts.join('; ') || 'N/A';
                const prevDisplay = companyLogo ? `<span class="with-logo"><img class="logo-icon" src="${companyLogo}" onerror="this.style.display='none'"><span>${expText}</span></span>` : expText;
                
                // Get the category number for this employee from precomputed data
                const empCatData = categoryNumbersByCompany[e.company_slug]?.[e.name];
                const categoryNum = empCatData?.num || null;
                
                // Build role tag text and apply highlighting
                const tag = getRoleTag(role.category);
                let roleTagTextRaw = tag.text;
                if (role.category !== 'Founder' && categoryNum !== null) {
                    if (role.level) {
                        roleTagTextRaw = `${tag.text} #${categoryNum} (${role.level})`;
                    } else {
                        roleTagTextRaw = `${tag.text} #${categoryNum}`;
                    }
                }
                const roleTagTextHighlighted = highlightMatch(roleTagTextRaw, query);
                const roleTagHtml = `<span class="role-tag ${tag.class}">${roleTagTextHighlighted}</span>`;
                
                const titleDisplay = `<span class="title-content">${roleTagHtml}<span class="title-text">${title}</span></span>`;
                
                const yoeHighlight = highlightMatch(String(yoe), query);
                
                html += `<tr class="employee-row">
                    <td>${e.rank}</td>
                    <td>${formatTenure(e.start_date, inceptionDates[e.company_slug])}</td>
                    <td><strong>${companyHighlight}</strong></td>
                    <td>${name}</td>
                    <td title="${(e.original_title || e.title).replace(/"/g, '&quot;')}">${titleDisplay}</td>
                    <td>${yoeHighlight}</td>
                    <td title="${(e.education || '').replace(/"/g, '&quot;')}">${eduDisplay}</td>
                    <td title="${expText.replace(/"/g, '&quot;')}">${prevDisplay}</td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
        initSearch();
    </script>
</body>
</html>
