<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <title>AI Teams</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 13px; padding: 20px; margin: 0; overflow-x: hidden; }
        html { overflow-x: hidden; }
        h1 { margin: 0 0 10px 0; }
        h2 { margin: 10px 0; }
        h3 { margin: 10px 0 5px 0; font-size: 13px; }
        h4 { margin: 8px 0 4px 0; font-size: 12px; font-weight: normal; color: #666; }
        .header { margin-bottom: 15px; }
        .search-bar {
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        #search-input {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 13px;
            padding: 4px 24px 4px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            width: 250px;
            background: transparent;
        }
        
        #search-input:focus {
            outline: none;
            border-bottom-color: #333;
        }
        
        #search-input::placeholder {
            color: #999;
        }
        
        .search-clear {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            font-size: 14px;
            background: none;
            border: none;
            padding: 4px;
        }
        
        .search-clear:hover {
            color: #333;
        }
        
        .search-results-info {
            margin-bottom: 10px;
            color: #666;
        }
        
        .search-match {
            background: #fff3cd;
        }
        
        /* Title cell layout */
        .title-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .title-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .role-tag {
            flex-shrink: 0;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 8px;
        }
        .role-tag-eng { background: #dbeafe; color: #1e40af; }
        .role-tag-founder { background: #f3e8ff; color: #7c3aed; }
        .role-tag-design { background: #dcfce7; color: #166534; }
        .role-tag-gtm { background: #fee2e2; color: #dc2626; }
        .role-tag-ops { background: #ffedd5; color: #c2410c; }
        .role-tag-other { background: #fef9c3; color: #a16207; }
        .role-tag-product { background: #e0e7ff; color: #4338ca; }
        .role-tag-finance { background: #f0fdf4; color: #15803d; }
        .role-tag-talent { background: #fce7f3; color: #be185d; }
        
        /* Prevent line breaks in tenure */
        td[title] {
            white-space: nowrap;
        }
        
        /* Column styling - consistent widths */
        table { width: 100%; table-layout: fixed; font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; }
        th, td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .col-rank { width: 25px; }
        .col-name { width: 140px; }
        .col-title { width: 280px; }
        .col-yoe { width: 35px; }
        .col-edu { width: 250px; }
        .col-prev { width: auto; }
        .col-action { width: 25px; padding: 4px !important; }
        
        /* Search results has company column */
        .col-company { width: 80px; }
        
        /* Logo styling */
        .logo-icon {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
            border-radius: 2px;
        }
        
        .with-logo {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .tabs { margin-bottom: 15px; }
        .tabs span { color: #999; cursor: pointer; }
        .tabs span:hover { color: #333; }
        .tabs span.active { color: #000; font-weight: bold; text-decoration: underline; }
        .tabs .sep { color: #ccc; margin: 0 8px; cursor: default; }
        
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            max-width: 100%;
        }
        
        .chart-panel {
            position: sticky;
            top: 20px;
            flex-shrink: 0;
            width: 320px;
        }
        
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 15px;
        }
        
        .chart-row {
            display: flex;
            align-items: center;
            font-variant-numeric: tabular-nums;
            height: 18px;
        }
        
        .chart-label {
            width: 45px;
            font-size: 10px;
            text-align: right;
            padding-right: 8px;
            flex-shrink: 0;
        }
        
        .chart-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .chart-bar {
            background: #d0d0d0;
            height: 14px;
            min-width: 0;
            transition: background 0.1s;
        }
        
        .chart-count {
            font-size: 10px;
            padding-left: 5px;
            color: #666;
        }
        
        .chart-raise {
            font-size: 9px;
            padding-left: 8px;
            color: #2a7c2a;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .chart-row.highlight .chart-bar { background: #333; }
        .chart-row.highlight .chart-label { font-weight: bold; }
        .chart-row.highlight .chart-count { color: #000; font-weight: bold; }
        .chart-row.selected { background: #eee; }
        
        .snapshot {
            border-top: 1px solid #ccc;
            padding-top: 10px;
            font-size: 11px;
        }
        
        .snapshot-header {
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        .snapshot-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        
        .snapshot-label {
            color: #333;
        }
        
        .snapshot-count {
            font-weight: bold;
        }
        
        .snapshot-sublevel {
            font-size: 10px;
            color: #666;
            padding-left: 24px;
        }
        
        .snapshot-names-section {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }
        
        .snapshot-names-group {
            margin-bottom: 6px;
        }
        
        .snapshot-names-label {
            font-size: 9px;
            color: #999;
            display: block;
        }
        
        .snapshot-names {
            font-size: 10px;
            color: #666;
            line-height: 1.4;
        }
        
        .table-panel {
            flex: 1;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .table-panel table {
            min-width: 900px;
        }
        
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f5f5f5; position: sticky; top: 0; }
        a { color: #0066cc; }
        
        .spam-btn { cursor: pointer; padding: 2px 8px; font-size: 11px; }
        
        tr.employee-row { transition: background 0.1s; }
        tr.employee-row.soft-highlight { background: #e8e8e8; }
        tr.employee-row.primary-highlight { background: #c0c0c0; }
        
        .title-cell { cursor: help; }
        .title-cell:hover { text-decoration: underline dotted #999; }
        
        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                font-size: 13px;
            }
            
            h1 { font-size: 20px; }
            h2 { font-size: 15px; }
            
            .header {
                margin-bottom: 12px;
            }
            
            .search-bar {
                display: block;
                margin-bottom: 12px;
            }
            
            #search-input {
                width: 100%;
                box-sizing: border-box;
                font-size: 16px;
                padding: 8px 28px 8px 0;
            }
            
            .search-clear {
                font-size: 18px;
            }
            
            .tabs {
                overflow-x: auto;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 10px;
                margin-bottom: 12px;
            }
            
            .tabs span {
                font-size: 14px;
                padding: 8px 4px;
                display: inline-block;
            }
            
            .tabs .sep {
                margin: 0 2px;
                padding: 8px 0;
            }
            
            /* Chart on top, table below on mobile */
            .main-layout {
                flex-direction: column;
            }
            
            .chart-panel {
                position: static;
                width: 100%;
                max-height: none;
                overflow-y: visible;
                border-bottom: 1px solid #ccc;
                border-top: none;
                padding-top: 0;
                padding-bottom: 10px;
                margin-bottom: 10px;
                margin-top: 0;
            }
            
            .chart-panel h3 {
                display: none;
            }
            
            .table-panel {
                width: 100%;
            }
            
            /* Horizontal bar chart on mobile */
            .chart-container {
                display: flex !important;
                flex-direction: row !important;
                align-items: flex-end !important;
                gap: 0 !important;
                height: 40px !important;
                width: 100% !important;
                margin-bottom: 0 !important;
            }
            
            .chart-row {
                flex: 1 1 0 !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-end !important;
                align-items: stretch !important;
                height: 100% !important;
                min-width: 0 !important;
                padding: 0 !important;
            }
            
            /* Hide labels, counts, raises on mobile */
            .chart-label,
            .chart-count,
            .chart-raise {
                display: none !important;
            }
            
            .chart-bar-container {
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-end !important;
                flex: 1 !important;
                height: 100% !important;
            }
            
            .chart-bar {
                width: 100% !important;
                height: var(--h, 0%) !important;
                min-width: 0 !important;
                background: #d0d0d0 !important;
            }
            
            /* Hide team preview on mobile */
            .snapshot {
                display: none;
            }
            
            /* Scrollable table on mobile */
            .table-panel {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            .table-panel table {
                min-width: 650px;
                font-size: 11px;
            }
            
            th, td {
                padding: 3px 4px;
            }
            
            /* Compact column widths for mobile */
            .col-rank { width: 20px; }
            .col-name { width: 100px; }
            .col-title { width: 140px; }
            .col-yoe { width: 30px; }
            .col-edu { width: 100px; }
            .col-prev { width: auto; }
            .col-company { width: 55px; }
            
            /* Hide logos on mobile */
            .logo-icon {
                display: none;
            }
            
            .role-tag {
                font-size: 8px;
                padding: 1px 4px;
            }
            
            /* Easier tap targets */
            a {
                padding: 4px 0;
                display: inline-block;
            }
        }
        
        .site-footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #888;
        }
        .site-footer a {
            color: #888;
            text-decoration: underline;
            text-decoration-thickness: 0.5px;
            text-underline-offset: 2px;
        }
        .site-footer a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Teams</h1>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search across all companies..." autocomplete="off">
            <span id="search-clear" class="search-clear" style="display: none;">×</span>
        </div>
        <div class="tabs" id="tabs"></div>
        <div id="company-info"></div>
    </div>
    <div id="content">Loading...</div>

    <script>
        const COMPANIES = [
            { slug: 'perplexity', file: 'perplexity_processed.json' },
            { slug: 'cognition', file: 'cognition_processed.json' },
            { slug: 'cursor', file: 'cursor_processed.json' },
            { slug: 'elevenlabs', file: 'elevenlabs_processed.json' },
            { slug: 'physical-intelligence', file: 'physical-intelligence_processed.json' },
            { slug: 'harvey', file: 'harvey_processed.json' },
            { slug: 'sierra', file: 'sierra_processed.json' },
            { slug: 'glean', file: 'glean_processed.json' },
            { slug: 'saronic', file: 'saronic_processed.json' },
            { slug: 'decagon', file: 'decagon_processed.json' },
            { slug: 'contextual', file: 'contextual_processed.json' },
            { slug: 'distyl', file: 'distyl_processed.json' },
            { slug: 'serval', file: 'serval_processed.json' },
            { slug: 'brainco', file: 'brainco_processed.json' },
        ];
        
        // Category order for sorting within months
        const CATEGORY_ORDER = ['Founder', 'Engineering', 'Product', 'Design', 'GTM', 'Finance', 'Talent', 'Ops', 'Other'];
        
        // Sort employees by: start_date, then category, then YoE (descending)
        function sortEmployees(employees) {
            return employees.sort((a, b) => {
                // First by start_date
                const dateCompare = a.start_date.localeCompare(b.start_date);
                if (dateCompare !== 0) return dateCompare;
                
                // Then by category order
                const catA = categorizeRole(a).category;
                const catB = categorizeRole(b).category;
                const catIndexA = CATEGORY_ORDER.indexOf(catA);
                const catIndexB = CATEGORY_ORDER.indexOf(catB);
                if (catIndexA !== catIndexB) return catIndexA - catIndexB;
                
                // Then by YoE (descending - more experience first)
                const yoeA = typeof inferYoE(a) === 'number' ? inferYoE(a) : -1;
                const yoeB = typeof inferYoE(b) === 'number' ? inferYoE(b) : -1;
                return yoeB - yoeA;
            });
        }
        
        let companyData = {};
        let spamData = {};
        let raisesData = {};
        let currentCompany = null;
        let currentEmployees = [];
        let allMonths = [];
        let selectedMonth = null;
        let searchMode = false;
        let searchQuery = '';
        let companyInceptionDate = null;
        
        // Role categorization
        function getEngLevel(yoe) {
            const y = parseInt(yoe) || 0;
            if (y <= 1) return 'Uni';
            if (y <= 3) return 'Jr';
            if (y <= 8) return 'Sr';
            return 'Staff';
        }
        
        function categorizeRole(emp) {
            // Use original title for better matching, fall back to normalized
            const t = (emp.original_title || emp.title || '').toLowerCase();
            const prev = (emp.previous_title || '').toLowerCase();
            const yoe = emp.yoe;
            
            // Helper function to categorize a title string
            function categorizeTitle(title, isPrevTitle = false) {
                // Founders FIRST - any title with "founder" is always Founder (for current title)
                if (!isPrevTitle && (title.includes('founder') || title.includes('co-founder') || title.includes('cofounder'))) {
                    return 'Founder';
                }
                
                // Product - check early to avoid false matches (e.g. "Human Product Manager")
                if (title.includes('product manager') || title.includes('product lead') ||
                    (title.includes('product') && !title.includes('chief product'))) {
                    return 'Product';
                }
                
                // Engineering - anything with "engineer" is always Engineering
                if (title.includes('engineer') || title.includes('developer') || 
                    title.includes('swe') || title.includes('technical staff') || 
                    title.includes('software') || title.includes('ml') ||
                    title.includes('machine learning') || title.includes('research') ||
                    title.includes('data scientist') || title.includes('data science') ||
                    title.includes('scientist') ||
                    title.includes('head of search') || title.includes('head of infrastructure') ||
                    title.includes('head of platform') || title.includes('head of ai') ||
                    title.includes('head of data') || title.includes('head of backend') ||
                    title.includes('head of frontend') || title.includes('head of engineering') ||
                    title.includes('director of engineering') || title.includes('vp of engineering') ||
                    title.includes('tech lead') || title.includes('technical lead') ||
                    title.includes('architect')) {
                    return 'Engineering';
                }
                
                // Founders - includes C-suite (ONLY for current title, not previous)
                // Exclude assistants to executives
                if (!isPrevTitle && !title.includes('assistant')) {
                    if (title.includes('founder') || title.includes('co-founder') || title.includes('cofounder') ||
                        title.includes('ceo') || title.includes('cto') || title.includes('coo') || title.includes('cfo') ||
                        title.includes('chief executive') || title.includes('chief technology') || 
                        title.includes('chief operating') || title.includes('chief financial') ||
                        title.includes('chief product') || title.includes('chief revenue')) {
                        return 'Founder';
                    }
                }
                
                // GTM (includes marketing, communications, sales, president)
                if (title.includes('gtm') || title.includes('sales') || title.includes('marketing') ||
                    title.includes('communications') || title.includes('comms') ||
                    title.includes('partnership') || title.includes('private equity') || 
                    title.includes('business development') || title.includes('account') ||
                    title.includes('enablement') || title.includes('revenue') || title.includes('president')) {
                    return 'GTM';
                }
                
                // Finance
                if (title.includes('finance') || title.includes('financial') || title.includes('accounting') ||
                    title.includes('controller') || title.includes('treasury')) {
                    return 'Finance';
                }
                
                // Talent
                if (title.includes('recruit') || title.includes('talent') || title.includes('people')) {
                    return 'Talent';
                }
                
                // Design
                if (title.includes('design') || title.includes('ux') || title.includes('ui')) {
                    return 'Design';
                }
                
                // Ops
                if (title.includes('operations') || title.includes('ops') || title.includes('special projects')) {
                    return 'Ops';
                }
                
                // Other (explicit matches)
                if (title.includes('community')) {
                    return 'Other';
                }
                
                return null;
            }
            
            // Try current title first
            const currentCategory = categorizeTitle(t, false);
            if (currentCategory) {
                if (currentCategory === 'Engineering') {
                    return { category: 'Engineering', level: getEngLevel(yoe) };
                }
                return { category: currentCategory, level: null };
            }
            
            // Fallback: try previous title (but skip Founder check)
            const prevCategory = categorizeTitle(prev, true);
            if (prevCategory) {
                if (prevCategory === 'Engineering') {
                    return { category: 'Engineering', level: getEngLevel(yoe) };
                }
                return { category: prevCategory, level: null };
            }
            
            return { category: 'Other', level: null };
        }
        
        function formatPersonName(name, age) {
            const parts = name.split(' ');
            const firstName = parts[0];
            const ageStr = age && age !== '?' ? ' ' + age.replace('~', '') : '';
            return `${firstName}${ageStr}`;
        }
        
        function getGradYear(education) {
            // Extract year from education like "BS CS, MIT '16" -> "'16"
            if (!education || education === 'N/A') return '?';
            const match = education.match(/'(\d{2})/);
            return match ? `'${match[1]}` : '?';
        }
        
        function inferYoE(employee) {
            // If YoE is provided and valid, use it
            if (employee.yoe != null && employee.yoe !== '?' && !isNaN(parseInt(employee.yoe))) {
                return Math.max(0, parseInt(employee.yoe));
            }
            // Otherwise infer from graduation year (assume graduate at 22)
            const gradYear = employee.grad_year || getGradYear(employee.education);
            if (gradYear && gradYear !== '?') {
                const yearNum = parseInt(gradYear.replace("'", ""));
                const fullYear = yearNum > 50 ? 1900 + yearNum : 2000 + yearNum;
                const currentYear = new Date().getFullYear();
                return Math.max(0, currentYear - fullYear);
            }
            return '?';
        }
        
        function formatDate(dateStr) {
            // Convert "2022-08" to "08-2022"
            if (!dateStr) return '?';
            const parts = dateStr.split('-');
            if (parts.length === 2) {
                return `${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }
        
        function formatTenure(startDate, inceptionDate) {
            // Convert start date to months since company inception (first hire = 0mo)
            if (!startDate) return '?';
            const inception = inceptionDate || companyInceptionDate;
            if (!inception) return '?';
            
            const [startYear, startMonth] = startDate.split('-').map(Number);
            const [incYear, incMonth] = inception.split('-').map(Number);
            
            const totalMonths = (startYear - incYear) * 12 + (startMonth - incMonth);
            
            return `${Math.max(0, totalMonths)}mo`;
        }
        
        function getRoleTag(category) {
            const config = {
                'Founder': { text: 'Founder', class: 'role-tag-founder' },
                'Engineering': { text: 'Eng', class: 'role-tag-eng' },
                'Product': { text: 'Product', class: 'role-tag-product' },
                'Design': { text: 'Design', class: 'role-tag-design' },
                'GTM': { text: 'GTM', class: 'role-tag-gtm' },
                'Finance': { text: 'Finance', class: 'role-tag-finance' },
                'Talent': { text: 'Talent', class: 'role-tag-talent' },
                'Ops': { text: 'Ops', class: 'role-tag-ops' },
                'Other': { text: 'Other', class: 'role-tag-other' }
            };
            return config[category] || { text: category, class: 'role-tag-other' };
        }
        
        function renderRoleTag(category) {
            const tag = getRoleTag(category);
            return `<span class="role-tag ${tag.class}">${tag.text}</span>`;
        }
        
        // Company domain mappings for logos
        const COMPANY_DOMAINS = {
            'google': 'google.com', 'meta': 'meta.com', 'facebook': 'meta.com',
            'apple': 'apple.com', 'amazon': 'amazon.com', 'microsoft': 'microsoft.com',
            'openai': 'openai.com', 'anthropic': 'anthropic.com', 'scale': 'scale.com',
            'scale ai': 'scale.com', 'stripe': 'stripe.com', 'uber': 'uber.com',
            'airbnb': 'airbnb.com', 'linkedin': 'linkedin.com', 'twitter': 'x.com',
            'x': 'x.com', 'netflix': 'netflix.com', 'palantir': 'palantir.com',
            'snowflake': 'snowflake.com', 'databricks': 'databricks.com',
            'nvidia': 'nvidia.com', 'tesla': 'tesla.com', 'spacex': 'spacex.com',
            'coinbase': 'coinbase.com', 'robinhood': 'robinhood.com',
            'figma': 'figma.com', 'notion': 'notion.so', 'slack': 'slack.com',
            'dropbox': 'dropbox.com', 'salesforce': 'salesforce.com',
            'deepmind': 'deepmind.com', 'google deepmind': 'deepmind.com',
            'waymo': 'waymo.com', 'cruise': 'getcruise.com', 'aurora': 'aurora.tech',
            'anysphere': 'cursor.com', 'cursor': 'cursor.com',
            'ramp': 'ramp.com', 'brex': 'brex.com', 'plaid': 'plaid.com',
            'doordash': 'doordash.com', 'instacart': 'instacart.com',
            'quora': 'quora.com', 'pinterest': 'pinterest.com', 'snap': 'snap.com',
            'lyft': 'lyft.com', 'square': 'squareup.com', 'block': 'block.xyz',
            'two sigma': 'twosigma.com', 'citadel': 'citadel.com', 'jane street': 'janestreet.com',
            'hudson river trading': 'hudsonrivertrading.com', 'tower research': 'tower-research.com',

        function getLevel(yoe) {
            const y = parseInt(yoe) || 0;
            if (yoe === '?' || isNaN(y)) return '?';
            if (y <= 1) return 'Uni';
            if (y <= 3) return 'Jr';
            if (y <= 8) return 'Sr';
            return 'Staff';
        }
        
        function buildSnapshot(employees, month) {
            // Get cumulative team up to and including selected month
            const team = employees.filter(e => e.start_date <= month);
            
            if (team.length === 0) {
                return '<div class="snapshot"><div class="snapshot-header">No team yet</div></div>';
            }
            
            // Categorize everyone
            const categories = {};
            const categoryPeople = {};
            const engLevels = { Uni: [], Jr: [], Sr: [], Staff: [] };
            
            team.forEach(e => {
                const { category, level } = categorizeRole(e);
                
                if (category === 'Engineering' && level) {
                    engLevels[level].push(e);
                }
                
                if (!categories[category]) {
                    categories[category] = 0;
                    categoryPeople[category] = [];
                }
                categories[category]++;
                categoryPeople[category].push(e);
            });
            
            // Sort helper: parse age, youngest first (lowest number first)
            const getAgeNum = (e) => {
                const age = e.age;
                if (!age || age === '?') return 999;
                return parseInt(age.replace('~', '')) || 999;
            };
            const sortByAge = (arr) => arr.sort((a, b) => getAgeNum(a) - getAgeNum(b));
            
            // Sort all category arrays by age
            Object.keys(categoryPeople).forEach(cat => sortByAge(categoryPeople[cat]));
            Object.keys(engLevels).forEach(level => sortByAge(engLevels[level]));
            
            const parts = month.split('-');
            const displayMonth = parts[1] + '/' + parts[0].slice(2);
            
            let html = '<div class="snapshot">';
            html += `<div class="snapshot-header">Team @ ${displayMonth}: ${team.length}</div>`;
            
            const order = ['Founder', 'Engineering', 'Product', 'Design', 'GTM', 'Finance', 'Talent', 'Ops', 'Other'];
            
            // Counts section
            order.forEach(cat => {
                if (categories[cat] && categories[cat] > 0) {
                    html += `<div class="snapshot-row">
                        <span class="snapshot-label">${renderRoleTag(cat)}</span>
                        <span class="snapshot-count">${categories[cat]}</span>
                    </div>`;
                    
                    if (cat === 'Engineering') {
                        const uniCount = engLevels.Uni.length;
                        const jrCount = engLevels.Jr.length;
                        const srCount = engLevels.Sr.length;
                        const staffCount = engLevels.Staff.length;
                        
                        const breakdown = [];
                        if (uniCount) breakdown.push(`${uniCount} Uni`);
                        if (jrCount) breakdown.push(`${jrCount} Jr`);
                        if (srCount) breakdown.push(`${srCount} Sr`);
                        if (staffCount) breakdown.push(`${staffCount} Staff`);
                        
                        if (breakdown.length) {
                            html += `<div class="snapshot-sublevel">${breakdown.join(' · ')}</div>`;
                        }
                    }
                }
            });
            
            // Names section
            html += '<div class="snapshot-names-section">';
            order.forEach(cat => {
                if (categoryPeople[cat] && categoryPeople[cat].length > 0) {
                    const names = categoryPeople[cat].map(e => formatPersonName(e.name, e.age)).join(', ');
                    html += `<div class="snapshot-names-group">
                        <span class="snapshot-names-label">${cat}</span>
                        <span class="snapshot-names">${names}</span>
                    </div>`;
                }
            });
            html += '</div>';
            
            html += '</div>';
            return html;
        }
        
        async function loadData() {
            let manualAdditions = {};
            
            try {
                const spamRes = await fetch('/spam.json');
                if (spamRes.ok) spamData = await spamRes.json();
            } catch (e) {}
            
            try {
                const raisesRes = await fetch('/raises.json');
                if (raisesRes.ok) raisesData = await raisesRes.json();
            } catch (e) {}
            
            try {
                const manualRes = await fetch('/manual_additions.json?v=' + Date.now());
                if (manualRes.ok) manualAdditions = await manualRes.json();
            } catch (e) {}
            
            for (const company of COMPANIES) {
                try {
                    const response = await fetch(company.file + '?v=' + Date.now());
                    if (response.ok) {
                        const data = await response.json();
                        
                        // Merge manual additions if any exist for this company
                        if (manualAdditions[company.slug]) {
                            const existingNames = new Set(data.employees.map(e => e.name.toLowerCase()));
                            const additions = manualAdditions[company.slug]
                                .filter(e => !existingNames.has(e.name.toLowerCase()))
                                .map(e => ({
                                    ...e,
                                    original_title: e.title,
                                    yoe: e.yoe || '?',
                                    grad_year: e.grad_year || (e.education?.match(/'(\d{2})/) ? `'${e.education.match(/'(\d{2})/)[1]}` : '?')
                                }));
                            data.employees = [...data.employees, ...additions];
                        }
                        
                        // Sort by start_date, then category, then YoE and re-rank
                        sortEmployees(data.employees);
                        data.employees.forEach((e, i) => e.rank = i + 1);
                        
                        companyData[company.slug] = data;
                    }
                } catch (e) {}
            }
            renderTabs();
            const first = Object.keys(companyData)[0];
            if (first) showCompany(first);
            else document.getElementById('content').textContent = 'No data found.';
        }
        
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const slugs = Object.keys(companyData);
            slugs.forEach((slug, i) => {
                const span = document.createElement('span');
                span.textContent = companyData[slug].company_display || slug;
                span.dataset.slug = slug;
                span.onclick = () => showCompany(slug);
                tabs.appendChild(span);
                if (i < slugs.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    tabs.appendChild(sep);
                }
            });
        }
        
        function isSpam(company, name) {
            return spamData[company]?.includes(name) || false;
        }
        
        async function toggleSpam(company, name) {
            const wasSpam = isSpam(company, name);
            
            try {
                await fetch('/spam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company, name, is_spam: !wasSpam })
                });
                
                if (!spamData[company]) spamData[company] = [];
                if (wasSpam) {
                    spamData[company] = spamData[company].filter(n => n !== name);
                } else {
                    spamData[company].push(name);
                }
                
                showCompany(currentCompany);
            } catch (e) {
                alert('Failed to save spam status');
            }
        }

        function buildTimeline(employees) {
            const byMonth = {};
            employees.forEach(e => {
                const month = e.start_date;
                if (!byMonth[month]) byMonth[month] = [];
                byMonth[month].push(e.rank);
            });
            
            const existingMonths = Object.keys(byMonth).sort();
            if (existingMonths.length === 0) return '<p>No hires</p>';
            
            allMonths = [];
            let [year, month] = existingMonths[0].split('-').map(Number);
            const [endYear, endMonth] = existingMonths[existingMonths.length - 1].split('-').map(Number);
            
            while (year < endYear || (year === endYear && month <= endMonth)) {
                const key = `${year}-${String(month).padStart(2, '0')}`;
                allMonths.push(key);
                if (!byMonth[key]) byMonth[key] = [];
                month++;
                if (month > 12) { month = 1; year++; }
            }
            
            const maxCount = Math.max(...allMonths.map(m => byMonth[m].length), 1);
            
            // Build lookup for raises
            const raises = raisesData[currentCompany] || [];
            const raisesByMonth = {};
            raises.forEach(r => {
                raisesByMonth[r.date] = r;
            });
            
            let html = '<div class="chart-container">';
            allMonths.forEach(m => {
                const hires = byMonth[m];
                const count = hires.length;
                const barWidth = count > 0 ? Math.max((count / maxCount) * 100, 5) : 0;
                const parts = m.split('-');
                const shortMonth = parts[1] + '/' + parts[0].slice(2);
                
                // Check for funding round this month
                const raise = raisesByMonth[m];
                let raiseHtml = '';
                if (raise) {
                    const amtStr = raise.amount >= 100 ? `$${raise.amount}M` : `$${raise.amount}M`;
                    raiseHtml = `<span class="chart-raise">— ${amtStr} ${raise.round}</span>`;
                }
                
                html += `<div class="chart-row" data-month="${m}" 
                    onmouseenter="highlightMonth('${m}')" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${m}', true)" style="cursor: pointer">
                    <span class="chart-label">${shortMonth}</span>
                    <div class="chart-bar-container">
                        <div class="chart-bar" style="width: ${barWidth}%; --h: ${barWidth * 0.4}px"></div>
                        <span class="chart-count">${count}</span>
                        ${raiseHtml}
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        function searchAllCompanies(query) {
            const results = [];
            const q = query.toLowerCase();
            
            Object.entries(companyData).forEach(([slug, data]) => {
                const companyName = data.company_display || slug;
                const employees = data.employees || [];
                
                employees.forEach(emp => {
                    if (isSpam(slug, emp.name)) return;
                    
                    // Get role for searching
                    const role = categorizeRole(emp);
                    
                    // Search across all columns
                    const searchFields = [
                        emp.name,
                        emp.title,
                        emp.original_title,
                        emp.education,
                        emp.previous_title,
                        emp.previous_company,
                        role.category,
                        companyName,
                        emp.grad_year,
                        emp.start_date
                    ].filter(Boolean).map(s => s.toLowerCase());
                    
                    const matches = searchFields.some(field => field.includes(q));
                    
                    if (matches) {
                        results.push({
                            ...emp,
                            company_slug: slug,
                            company_name: companyName
                        });
                    }
                });
            });
            
            // Sort by company then by rank
            results.sort((a, b) => {
                if (a.company_slug !== b.company_slug) {
                    return a.company_slug.localeCompare(b.company_slug);
                }
                return a.rank - b.rank;
            });
            
            return results;
        }

            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="search-match">$1</span>');
        }

                const expText = expParts.join('; ') || 'N/A';
                const prevDisplay = companyLogo ? `<span class="with-logo"><img class="logo-icon" src="${companyLogo}" onerror="this.style.display='none'">${expText}</span>` : expText;
                
                const titleDisplay = `<span class="title-content"><span class="title-text">${title}</span>${renderRoleTag(role.category)}</span>`;
                
                html += `<tr class="employee-row">
                    <td>${e.rank}</td>
                    <td><strong>${companyHighlight}</strong></td>
                    <td>${name}</td>
                    <td title="${(e.original_title || e.title).replace(/"/g, '&quot;')}">${titleDisplay}</td>
                    <td>${yoe}</td>
                    <td title="${(e.education || '').replace(/"/g, '&quot;')}">${eduDisplay}</td>
                    <td title="${expText.replace(/"/g, '&quot;')}">${prevDisplay}</td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
        initSearch();
    </script>

    </footer>
</body>
