<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Employees</title>
    <style>
        body { font-family: monospace; font-size: 13px; padding: 20px; margin: 0; }
        h1 { margin: 0 0 10px 0; }
        h2 { margin: 10px 0; }
        h3 { margin: 10px 0 5px 0; font-size: 13px; }
        h4 { margin: 8px 0 4px 0; font-size: 12px; font-weight: normal; color: #666; }
        .header { margin-bottom: 15px; }
        .tabs { margin-bottom: 15px; }
        .tabs span { color: #999; cursor: pointer; }
        .tabs span:hover { color: #333; }
        .tabs span.active { color: #000; font-weight: bold; text-decoration: underline; }
        .tabs .sep { color: #ccc; margin: 0 8px; cursor: default; }
        
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .chart-panel {
            position: sticky;
            top: 20px;
            flex-shrink: 0;
            width: 280px;
        }
        
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 15px;
        }
        
        .chart-row {
            display: flex;
            align-items: center;
            height: 18px;
        }
        
        .chart-label {
            width: 45px;
            font-size: 10px;
            text-align: right;
            padding-right: 8px;
            flex-shrink: 0;
        }
        
        .chart-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .chart-bar {
            background: #d0d0d0;
            height: 14px;
            min-width: 0;
            transition: background 0.1s;
        }
        
        .chart-count {
            font-size: 10px;
            padding-left: 5px;
            color: #666;
        }
        
        .chart-row.highlight .chart-bar { background: #333; }
        .chart-row.highlight .chart-label { font-weight: bold; }
        .chart-row.highlight .chart-count { color: #000; font-weight: bold; }
        .chart-row.selected { background: #eee; }
        
        .snapshot {
            border-top: 1px solid #ccc;
            padding-top: 10px;
            font-size: 11px;
        }
        
        .snapshot-header {
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .snapshot-category {
            margin-bottom: 6px;
        }
        
        .snapshot-category-title {
            color: #666;
            font-size: 10px;
        }
        
        .snapshot-people {
            margin-left: 0;
        }
        
        .table-panel {
            flex: 1;
            overflow-x: auto;
        }
        
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f5f5f5; position: sticky; top: 0; }
        a { color: #0066cc; }
        
        .spam-btn { cursor: pointer; padding: 2px 8px; font-size: 11px; }
        
        tr.employee-row { transition: background 0.1s; }
        tr.employee-row.soft-highlight { background: #e8e8e8; }
        tr.employee-row.primary-highlight { background: #c0c0c0; }
        
        @media (max-width: 800px) {
            .main-layout {
                flex-direction: column;
            }
            
            .chart-panel {
                position: static;
                width: 100%;
                max-height: 400px;
                overflow-y: auto;
                border-bottom: 1px solid #ccc;
                padding-bottom: 15px;
                margin-bottom: 15px;
            }
            
            .table-panel {
                width: 100%;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Early Employee Tracker</h1>
        <div class="tabs" id="tabs"></div>
        <div id="company-info"></div>
    </div>
    <div id="content">Loading...</div>

    <script>
        const COMPANIES = [
            { slug: 'perplexity', file: 'perplexity_processed.json' },
            { slug: 'cognition', file: 'cognition_processed.json' },
        ];
        
        let companyData = {};
        let spamData = {};
        let currentCompany = null;
        let currentEmployees = [];
        let allMonths = [];
        
        // Role categorization
        function getEngLevel(yoe) {
            const y = parseInt(yoe) || 0;
            if (y <= 1) return 'Uni';
            if (y <= 3) return 'Jr';
            if (y <= 8) return 'Sr';
            return 'Staff';
        }
        
        function categorizeRole(emp) {
            const t = emp.title.toLowerCase();
            const yoe = emp.yoe;
            
            // Founders
            if (t.includes('founder') || t.includes('co-founder') || t.includes('cofounder')) {
                return { category: 'Founders', level: null };
            }
            
            // Engineering
            if (t.includes('engineer') || t.includes('developer') || t.includes('swe') || 
                t.includes('technical staff') || t.includes('software')) {
                return { category: 'Engineering', level: getEngLevel(yoe) };
            }
            
            // Research
            if (t.includes('research')) {
                return { category: 'Research', level: null };
            }
            
            // Product
            if (t.includes('product manager') || t.includes('pm') || t.includes('product')) {
                return { category: 'Product', level: null };
            }
            
            // Design
            if (t.includes('design') || t.includes('ux') || t.includes('ui')) {
                return { category: 'Design', level: null };
            }
            
            // Ops / Business
            if (t.includes('operations') || t.includes('ops') || t.includes('business') || 
                t.includes('strategy') || t.includes('gtm') || t.includes('sales') || 
                t.includes('marketing') || t.includes('hr') || t.includes('human resources') ||
                t.includes('account') || t.includes('enablement')) {
                return { category: 'Operations', level: null };
            }
            
            return { category: 'Other', level: null };
        }
        
        function formatPersonName(name, age) {
            const parts = name.split(' ');
            const firstName = parts[0];
            const lastInitial = parts.length > 1 ? parts[parts.length - 1][0] : '';
            const ageStr = age && age !== '?' ? ` (${age.replace('~', '')})` : '';
            return `${firstName} ${lastInitial}${ageStr}`;
        }
        
        function buildSnapshot(employees, selectedMonth) {
            // Get cumulative team up to and including selected month
            const team = employees.filter(e => e.start_date <= selectedMonth);
            
            if (team.length === 0) {
                return '<div class="snapshot"><div class="snapshot-header">No team yet</div></div>';
            }
            
            // Categorize everyone
            const categories = {};
            const engLevels = { Uni: [], Jr: [], Sr: [], Staff: [] };
            
            team.forEach(e => {
                const { category, level } = categorizeRole(e);
                const personStr = formatPersonName(e.name, e.age);
                
                if (category === 'Engineering' && level) {
                    engLevels[level].push(personStr);
                }
                
                if (!categories[category]) categories[category] = [];
                categories[category].push(personStr);
            });
            
            const parts = selectedMonth.split('-');
            const displayMonth = parts[1] + '/' + parts[0].slice(2);
            
            let html = '<div class="snapshot">';
            html += `<div class="snapshot-header">Team @ ${displayMonth}: ${team.length} people</div>`;
            
            // Show categories in order
            const order = ['Founders', 'Engineering', 'Research', 'Product', 'Design', 'Operations', 'Other'];
            
            order.forEach(cat => {
                if (categories[cat] && categories[cat].length > 0) {
                    html += '<div class="snapshot-category">';
                    
                    if (cat === 'Engineering') {
                        const staffCount = engLevels.Staff.length;
                        const srCount = engLevels.Sr.length;
                        const jrCount = engLevels.Jr.length;
                        const uniCount = engLevels.Uni.length;
                        
                        let engLabel = `Engineering (${categories[cat].length})`;
                        const breakdown = [];
                        if (staffCount) breakdown.push(`${staffCount} Staff`);
                        if (srCount) breakdown.push(`${srCount} Sr`);
                        if (jrCount) breakdown.push(`${jrCount} Jr`);
                        if (uniCount) breakdown.push(`${uniCount} Uni`);
                        if (breakdown.length) engLabel += `: ${breakdown.join(', ')}`;
                        
                        html += `<div class="snapshot-category-title">${engLabel}</div>`;
                    } else {
                        html += `<div class="snapshot-category-title">${cat} (${categories[cat].length})</div>`;
                    }
                    
                    html += `<div class="snapshot-people">${categories[cat].join(', ')}</div>`;
                    html += '</div>';
                }
            });
            
            html += '</div>';
            return html;
        }
        
        async function loadData() {
            try {
                const spamRes = await fetch('/spam.json');
                if (spamRes.ok) spamData = await spamRes.json();
            } catch (e) {}
            
            for (const company of COMPANIES) {
                try {
                    const response = await fetch(company.file);
                    if (response.ok) {
                        companyData[company.slug] = await response.json();
                    }
                } catch (e) {}
            }
            renderTabs();
            const first = Object.keys(companyData)[0];
            if (first) showCompany(first);
            else document.getElementById('content').textContent = 'No data found.';
        }
        
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const slugs = Object.keys(companyData);
            slugs.forEach((slug, i) => {
                const span = document.createElement('span');
                span.textContent = companyData[slug].company_display || slug;
                span.dataset.slug = slug;
                span.onclick = () => showCompany(slug);
                tabs.appendChild(span);
                if (i < slugs.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    tabs.appendChild(sep);
                }
            });
        }
        
        function isSpam(company, name) {
            return spamData[company]?.includes(name) || false;
        }
        
        async function toggleSpam(company, name) {
            const wasSpam = isSpam(company, name);
            
            try {
                await fetch('/spam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company, name, is_spam: !wasSpam })
                });
                
                if (!spamData[company]) spamData[company] = [];
                if (wasSpam) {
                    spamData[company] = spamData[company].filter(n => n !== name);
                } else {
                    spamData[company].push(name);
                }
                
                showCompany(currentCompany);
            } catch (e) {
                alert('Failed to save spam status');
            }
        }
        
        function highlightMonth(month, primaryRow = null) {
            document.querySelectorAll('.chart-row').forEach(row => {
                row.classList.toggle('highlight', row.dataset.month === month);
            });
            document.querySelectorAll('.employee-row').forEach(row => {
                row.classList.remove('soft-highlight', 'primary-highlight');
                if (row.dataset.month === month) {
                    if (row === primaryRow) {
                        row.classList.add('primary-highlight');
                    } else {
                        row.classList.add('soft-highlight');
                    }
                }
            });
            
            // Update snapshot on hover
            const snapshotEl = document.getElementById('snapshot');
            if (snapshotEl && month) {
                snapshotEl.innerHTML = buildSnapshot(currentEmployees, month);
            }
        }
        
        function clearHighlight() {
            document.querySelectorAll('.chart-row').forEach(row => row.classList.remove('highlight'));
            document.querySelectorAll('.employee-row').forEach(row => {
                row.classList.remove('soft-highlight', 'primary-highlight');
            });
        }
        
        function selectMonth(month) {
            // Update selected state
            document.querySelectorAll('.chart-row').forEach(row => {
                row.classList.toggle('selected', row.dataset.month === month);
            });
            
            // Update snapshot
            const snapshotEl = document.getElementById('snapshot');
            if (snapshotEl) {
                snapshotEl.innerHTML = buildSnapshot(currentEmployees, month);
            }
            
            // Jump to first row
            const firstRow = document.querySelector(`.employee-row[data-month="${month}"]`);
            if (firstRow) {
                firstRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                highlightMonth(month, firstRow);
            }
        }
        
        function buildTimeline(employees) {
            const byMonth = {};
            employees.forEach(e => {
                const month = e.start_date;
                if (!byMonth[month]) byMonth[month] = [];
                byMonth[month].push(e.rank);
            });
            
            const existingMonths = Object.keys(byMonth).sort();
            if (existingMonths.length === 0) return '<p>No hires</p>';
            
            allMonths = [];
            let [year, month] = existingMonths[0].split('-').map(Number);
            const [endYear, endMonth] = existingMonths[existingMonths.length - 1].split('-').map(Number);
            
            while (year < endYear || (year === endYear && month <= endMonth)) {
                const key = `${year}-${String(month).padStart(2, '0')}`;
                allMonths.push(key);
                if (!byMonth[key]) byMonth[key] = [];
                month++;
                if (month > 12) { month = 1; year++; }
            }
            
            const maxCount = Math.max(...allMonths.map(m => byMonth[m].length), 1);
            
            let html = '<div class="chart-container">';
            allMonths.forEach(m => {
                const hires = byMonth[m];
                const count = hires.length;
                const barWidth = count > 0 ? Math.max((count / maxCount) * 100, 5) : 0;
                const parts = m.split('-');
                const shortMonth = parts[1] + '/' + parts[0].slice(2);
                
                html += `<div class="chart-row" data-month="${m}" 
                    onmouseenter="highlightMonth('${m}')" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${m}')" style="cursor: pointer">
                    <span class="chart-label">${shortMonth}</span>
                    <div class="chart-bar-container">
                        <div class="chart-bar" style="width: ${barWidth}%"></div>
                        <span class="chart-count">${count}</span>
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }
        
        function showCompany(slug) {
            currentCompany = slug;
            document.querySelectorAll('.tabs span[data-slug]').forEach(s => 
                s.classList.toggle('active', s.dataset.slug === slug));
            
            const data = companyData[slug];
            const allEmployees = data.employees || [];
            
            currentEmployees = allEmployees.filter(e => !isSpam(slug, e.name));
            const spamCount = allEmployees.length - currentEmployees.length;
            
            document.getElementById('company-info').innerHTML = 
                `<strong>${data.company_display || data.company}</strong> · Founded: ${data.founded || '?'} · ${currentEmployees.length} employees${spamCount > 0 ? ` (${spamCount} hidden)` : ''}`;
            
            let html = '<div class="main-layout">';
            
            // Chart panel
            html += '<div class="chart-panel">';
            html += '<h3>Hires by Month</h3>';
            html += buildTimeline(currentEmployees);
            
            // Snapshot (default to last month)
            const lastMonth = allMonths.length > 0 ? allMonths[allMonths.length - 1] : null;
            html += `<div id="snapshot">${lastMonth ? buildSnapshot(currentEmployees, lastMonth) : ''}</div>`;
            html += '</div>';
            
            // Table panel
            html += '<div class="table-panel">';
            html += `<table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>YoE</th>
                    <th>Started</th>
                    <th>Title</th>
                    <th>Education</th>
                    <th>Previous</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>`;
            
            currentEmployees.forEach(e => {
                const name = e.linkedin_url 
                    ? `<a href="${e.linkedin_url}" target="_blank">${e.name}</a>` 
                    : e.name;
                html += `<tr class="employee-row" data-month="${e.start_date}" 
                    onmouseenter="highlightMonth('${e.start_date}', this)" onmouseleave="clearHighlight()">
                    <td>${e.rank}</td>
                    <td>${name}</td>
                    <td>${e.age}</td>
                    <td>${e.yoe}</td>
                    <td>${e.start_date}</td>
                    <td>${e.title}</td>
                    <td>${e.education}</td>
                    <td>${e.previous_title} @ ${e.previous_company}</td>
                    <td><button class="spam-btn" onclick="toggleSpam('${slug}', '${e.name.replace(/'/g, "\\'")}')">×</button></td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            html += '</div>';
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
    </script>
</body>
</html>
