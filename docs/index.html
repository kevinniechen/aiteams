    <style>
        body { font-family: monospace; font-size: 13px; padding: 20px; margin: 0; }
        h1 { margin: 0 0 10px 0; }
        h2 { margin: 10px 0; }
        h3 { margin: 10px 0 5px 0; font-size: 13px; }
        h4 { margin: 8px 0 4px 0; font-size: 12px; font-weight: normal; color: #666; }
        .header { margin-bottom: 15px; }
        .tabs { margin-bottom: 15px; }
        .tabs span { color: #999; cursor: pointer; }
        .tabs span:hover { color: #333; }
        .tabs span.active { color: #000; font-weight: bold; text-decoration: underline; }
        .tabs .sep { color: #ccc; margin: 0 8px; cursor: default; }
        
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .chart-panel {
            position: sticky;
            top: 20px;
            flex-shrink: 0;
            width: 320px;
        }
        
        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 15px;
        }
        
        .chart-row {
            display: flex;
            align-items: center;
            height: 18px;
        }
        
        .chart-label {
            width: 45px;
            font-size: 10px;
            text-align: right;
            padding-right: 8px;
            flex-shrink: 0;
        }
        
        .chart-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
        }
        
        .chart-bar {
            background: #d0d0d0;
            height: 14px;
            min-width: 0;
            transition: background 0.1s;
        }
        
        .chart-count {
            font-size: 10px;
            padding-left: 5px;
            color: #666;
        }
        
        .chart-raise {
            font-size: 9px;
            padding-left: 8px;
            color: #2a7c2a;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .chart-row.highlight .chart-bar { background: #333; }
        .chart-row.highlight .chart-label { font-weight: bold; }
        .chart-row.highlight .chart-count { color: #000; font-weight: bold; }
        .chart-row.selected { background: #eee; }
        
        .snapshot {
            border-top: 1px solid #ccc;
            padding-top: 10px;
            font-size: 11px;
        }
        
        .snapshot-header {
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        
        .snapshot-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        
        .snapshot-label {
            color: #333;
        }
        
        .snapshot-count {
            font-weight: bold;
        }
        
        .snapshot-sublevel {
            font-size: 10px;
            color: #666;
            padding-left: 10px;
        }
        
        .snapshot-names-section {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #eee;
        }
        
        .snapshot-names-group {
            margin-bottom: 6px;
        }
        
        .snapshot-names-label {
            font-size: 9px;
            color: #999;
            display: block;
        }
        
        .snapshot-names {
            font-size: 10px;
            color: #666;
            line-height: 1.4;
        }
        
        .table-panel {
            flex: 1;
            overflow-x: auto;
        }
        
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f5f5f5; position: sticky; top: 0; }
        a { color: #0066cc; }
        
        
        
        tr.employee-row { transition: background 0.1s; }
        tr.employee-row.soft-highlight { background: #e8e8e8; }
        tr.employee-row.primary-highlight { background: #c0c0c0; }
        
        @media (max-width: 800px) {
            .main-layout {
                flex-direction: column;
            }
            
            .chart-panel {
                position: static;
                width: 100%;
                max-height: 400px;
                overflow-y: auto;
                border-bottom: 1px solid #ccc;
                padding-bottom: 15px;
                margin-bottom: 15px;
            }
            
            .table-panel {
                width: 100%;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 4px 6px;
            }
        }
    </style>
</head>

        }
        
        function getGradYear(education) {
            // Extract year from education like "BS CS, MIT '16" -> "'16"
            if (!education || education === 'N/A') return '?';
            const match = education.match(/'(\d{2})/);
            return match ? `'${match[1]}` : '?';
        }
        
        function getLevel(yoe) {
            const y = parseInt(yoe) || 0;
            if (yoe === '?' || isNaN(y)) return '?';
            if (y <= 1) return 'Uni';
            if (y <= 3) return 'Jr';
            if (y <= 8) return 'Sr';
            return 'Staff';
        }
        
        function buildSnapshot(employees, month) {
            // Get cumulative team up to and including selected month
            const team = employees.filter(e => e.start_date <= month);
            
            if (team.length === 0) {
                return '<div class="snapshot"><div class="snapshot-header">No team yet</div></div>';
            }
            
            // Categorize everyone
            const categories = {};
            const categoryPeople = {};
            const engLevels = { Uni: [], Jr: [], Sr: [], Staff: [] };
            
            team.forEach(e => {
                const { category, level } = categorizeRole(e);
                
                if (category === 'Engineering' && level) {
                    engLevels[level].push(e);
                }
                
                if (!categories[category]) {
                    categories[category] = 0;
                    categoryPeople[category] = [];
                }
                categories[category]++;
                categoryPeople[category].push(e);
            });
            
            // Sort helper: parse age, youngest first (lowest number first)
            const getAgeNum = (e) => {
                const age = e.age;
                if (!age || age === '?') return 999;
                return parseInt(age.replace('~', '')) || 999;
            };
            const sortByAge = (arr) => arr.sort((a, b) => getAgeNum(a) - getAgeNum(b));
            
            // Sort all category arrays by age
            Object.keys(categoryPeople).forEach(cat => sortByAge(categoryPeople[cat]));
            Object.keys(engLevels).forEach(level => sortByAge(engLevels[level]));
            
            const parts = month.split('-');
            const displayMonth = parts[1] + '/' + parts[0].slice(2);
            
            let html = '<div class="snapshot">';
            html += `<div class="snapshot-header">Team @ ${displayMonth}: ${team.length}</div>`;
            
            const order = ['Founders', 'Engineering', 'Research', 'Product', 'Design', 'Operations', 'Other'];
            
            // Counts section
            order.forEach(cat => {
                if (categories[cat] && categories[cat] > 0) {
                    html += `<div class="snapshot-row">
                        <span class="snapshot-label">${cat}</span>
                        <span class="snapshot-count">${categories[cat]}</span>
                    </div>`;
                    
                    if (cat === 'Engineering') {
                        const uniCount = engLevels.Uni.length;
                        const jrCount = engLevels.Jr.length;
                        const srCount = engLevels.Sr.length;
                        const staffCount = engLevels.Staff.length;
                        
                        const breakdown = [];
                        if (uniCount) breakdown.push(`${uniCount} Uni`);
                        if (jrCount) breakdown.push(`${jrCount} Jr`);
                        if (srCount) breakdown.push(`${srCount} Sr`);
                        if (staffCount) breakdown.push(`${staffCount} Staff`);
                        
                        if (breakdown.length) {
                            html += `<div class="snapshot-sublevel">${breakdown.join(' · ')}</div>`;
                        }
                    }
                }
            });
            
            // Names section
            html += '<div class="snapshot-names-section">';
            order.forEach(cat => {
                if (categoryPeople[cat] && categoryPeople[cat].length > 0) {
                    const names = categoryPeople[cat].map(e => formatPersonName(e.name, e.age)).join(', ');
                    html += `<div class="snapshot-names-group">
                        <span class="snapshot-names-label">${cat}</span>
                        <span class="snapshot-names">${names}</span>
                    </div>`;
                }
            });
            html += '</div>';
            
            html += '</div>';
            return html;
        }
        
        async function loadData() {
            // Static site: use preloaded data
            companyData = PRELOADED_DATA;
            raisesData = PRELOADED_RAISES;
            spamData = PRELOADED_SPAM; // Spam filtering stays active, just no edit buttons
            
            renderTabs();
            const first = Object.keys(companyData)[0];
            if (first) showCompany(first);
            else document.getElementById('content').textContent = 'No data found.';
        }
        
        function renderTabs() {
            const tabs = document.getElementById('tabs');
            const slugs = Object.keys(companyData);
            slugs.forEach((slug, i) => {
                const span = document.createElement('span');
                span.textContent = companyData[slug].company_display || slug;
                span.dataset.slug = slug;
                span.onclick = () => showCompany(slug);
                tabs.appendChild(span);
                if (i < slugs.length - 1) {
                    const sep = document.createElement('span');
                    sep.className = 'sep';
                    sep.textContent = '/';
                    tabs.appendChild(sep);
                }
            });
        }
        
        function isSpam(company, name) {
            return spamData[company]?.includes(name) || false;
        }
        
        // toggleSpam removed in static build
        
        function highlightMonth(month, primaryRow = null) {
            document.querySelectorAll('.chart-row').forEach(row => {
                row.classList.toggle('highlight', row.dataset.month === month);
            });
            document.querySelectorAll('.employee-row').forEach(row => {
                row.classList.remove('soft-highlight', 'primary-highlight');
                if (row.dataset.month === month) {
                    if (row === primaryRow) {
                        row.classList.add('primary-highlight');
                    } else {
                        row.classList.add('soft-highlight');
                    }
                }
            });
            
            // Update snapshot on hover
            const snapshotEl = document.getElementById('snapshot');
            if (snapshotEl && month) {
                snapshotEl.innerHTML = buildSnapshot(currentEmployees, month);
            }
        }
        
        function clearHighlight() {
            document.querySelectorAll('.chart-row').forEach(row => row.classList.remove('highlight'));
            document.querySelectorAll('.employee-row').forEach(row => {
                row.classList.remove('soft-highlight', 'primary-highlight');
            });
            
            // If there's a selected month, revert snapshot to it
            if (selectedMonth) {
                const snapshotEl = document.getElementById('snapshot');
                if (snapshotEl) {
                    snapshotEl.innerHTML = buildSnapshot(currentEmployees, selectedMonth);
                }
                // Re-highlight selected month
                document.querySelectorAll('.chart-row').forEach(row => {
                    row.classList.toggle('selected', row.dataset.month === selectedMonth);
                });
                document.querySelectorAll('.employee-row').forEach(row => {
                    row.classList.toggle('soft-highlight', row.dataset.month === selectedMonth);
                });
            }
        }
        
        function selectMonth(month, shouldScroll = false) {
            // Toggle selection
            if (selectedMonth === month) {
                selectedMonth = null;
            } else {
                selectedMonth = month;
            }
            
            // Update selected state on chart
            document.querySelectorAll('.chart-row').forEach(row => {
                row.classList.toggle('selected', row.dataset.month === selectedMonth);
            });
            
            // Update snapshot
            const snapshotEl = document.getElementById('snapshot');
            if (snapshotEl) {
                const displayMonth = selectedMonth || allMonths[allMonths.length - 1];
                snapshotEl.innerHTML = buildSnapshot(currentEmployees, displayMonth);
            }
            
            // Highlight rows for selected month
            if (selectedMonth) {
                document.querySelectorAll('.employee-row').forEach(row => {
                    row.classList.toggle('soft-highlight', row.dataset.month === selectedMonth);
                });
                
                // Jump to first row only if shouldScroll is true (clicked on chart bar)
                if (shouldScroll) {
                    const firstRow = document.querySelector(`.employee-row[data-month="${month}"]`);
                    if (firstRow) {
                        firstRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            } else {
                document.querySelectorAll('.employee-row').forEach(row => {
                    row.classList.remove('soft-highlight', 'primary-highlight');
                });
            }
        }
        
        function buildTimeline(employees) {
            const byMonth = {};
            employees.forEach(e => {
                const month = e.start_date;
                if (!byMonth[month]) byMonth[month] = [];
                byMonth[month].push(e.rank);
            });
            
            const existingMonths = Object.keys(byMonth).sort();
            if (existingMonths.length === 0) return '<p>No hires</p>';
            
            allMonths = [];
            let [year, month] = existingMonths[0].split('-').map(Number);
            const [endYear, endMonth] = existingMonths[existingMonths.length - 1].split('-').map(Number);
            
            while (year < endYear || (year === endYear && month <= endMonth)) {
                const key = `${year}-${String(month).padStart(2, '0')}`;
                allMonths.push(key);
                if (!byMonth[key]) byMonth[key] = [];
                month++;
                if (month > 12) { month = 1; year++; }
            }
            
            const maxCount = Math.max(...allMonths.map(m => byMonth[m].length), 1);
            
            // Build lookup for raises
            const raises = raisesData[currentCompany] || [];
            const raisesByMonth = {};
            raises.forEach(r => {
                raisesByMonth[r.date] = r;
            });
            
            let html = '<div class="chart-container">';
            allMonths.forEach(m => {
                const hires = byMonth[m];
                const count = hires.length;
                const barWidth = count > 0 ? Math.max((count / maxCount) * 100, 5) : 0;
                const parts = m.split('-');
                const shortMonth = parts[1] + '/' + parts[0].slice(2);
                
                // Check for funding round this month
                const raise = raisesByMonth[m];
                let raiseHtml = '';
                if (raise) {
                    const amtStr = raise.amount >= 100 ? `$${raise.amount}M` : `$${raise.amount}M`;
                    raiseHtml = `<span class="chart-raise">— ${amtStr} ${raise.round}</span>`;
                }
                
                html += `<div class="chart-row" data-month="${m}" 
                    onmouseenter="highlightMonth('${m}')" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${m}', true)" style="cursor: pointer">
                    <span class="chart-label">${shortMonth}</span>
                    <div class="chart-bar-container">
                        <div class="chart-bar" style="width: ${barWidth}%"></div>
                        <span class="chart-count">${count}</span>
                        ${raiseHtml}
                    </div>
                </div>`;
            });
            html += '</div>';
            return html;
        }
        
        function showCompany(slug) {
            currentCompany = slug;
            document.querySelectorAll('.tabs span[data-slug]').forEach(s => 
                s.classList.toggle('active', s.dataset.slug === slug));
            
            const data = companyData[slug];
            const allEmployees = data.employees || [];
            
            currentEmployees = allEmployees.filter(e => !isSpam(slug, e.name));
            const spamCount = allEmployees.length - currentEmployees.length;
            
            document.getElementById('company-info').innerHTML = 
                `<strong>${data.company_display || data.company}</strong> · Founded: ${data.founded || '?'} · ${currentEmployees.length} employees${spamCount > 0 ? ` (${spamCount} hidden)` : ''}`;
            
            let html = '<div class="main-layout">';
            
            // Chart panel
            html += '<div class="chart-panel">';
            html += '<h3>Hires by Month</h3>';
            html += buildTimeline(currentEmployees);
            
            // Snapshot (default to last month)
            const lastMonth = allMonths.length > 0 ? allMonths[allMonths.length - 1] : null;
            html += `<div id="snapshot">${lastMonth ? buildSnapshot(currentEmployees, lastMonth) : ''}</div>`;
            html += '</div>';
            
            // Table panel
            html += '<div class="table-panel">';
            html += `<table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Grad</th>
                    <th>YoE</th>
                    <th>Started</th>
                    <th>Title</th>
                    <th>Education</th>
                    <th>Previous</th>
                    
                </tr>
                </thead>
                <tbody>`;
            
            currentEmployees.forEach(e => {
                const name = e.linkedin_url 
                    ? `<a href="${e.linkedin_url}" target="_blank">${e.name}</a>` 
                    : e.name;
                const grad = e.grad_year || getGradYear(e.education);
                const yoe = e.yoe || '?';
                html += `<tr class="employee-row" data-month="${e.start_date}" 
                    onmouseenter="highlightMonth('${e.start_date}', this)" onmouseleave="clearHighlight()"
                    onclick="selectMonth('${e.start_date}', false)" style="cursor: pointer">
                    <td>${e.rank}</td>
                    <td>${name}</td>
                    <td>${grad}</td>
                    <td>${yoe}</td>
                    <td>${e.start_date}</td>
                    <td>${e.title}</td>
                    <td>${e.education}</td>
                    <td>${e.previous_title} @ ${e.previous_company}</td>
                    <td><button class="spam-btn" onclick="toggleSpam('${slug}', '${e.name.replace(/'/g, "\\'")}')">×</button></td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            html += '</div>';
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
    </script>
</body>
</html>
